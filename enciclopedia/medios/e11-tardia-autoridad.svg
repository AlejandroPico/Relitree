<title id="tit">Roma y otras sedes del Mediterráneo</title><desc id="des">Sárdica, ca. 343. Cánones occidentales sobre revisión de causas episcopales. Calcedonia, 451. Tomo de León y debate sobre el canon 28. 494. Gelasio escribe a Anastasio sobre la autoridad sacerdotal y el poder civil. 519. La fórmula de Hormisdas acompaña el restablecimiento de la comunión.</desc>
