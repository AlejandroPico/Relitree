<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 438" role="img" aria-labelledby="titulo nota">
<title id="titulo">Libro secreto de Juan</title><desc id="nota">Una síntesis del relato según los testimonios coptos.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#203b30}.h{font-size:23px;font-weight:650}.d{font-size:19px}.t{font-size:32px;font-weight:700}</style>
<rect width="780" height="438" fill="#f6f5ef"/>
<text x="32" y="54" class="t">Libro secreto de Juan</text>
<text x="32" y="86" class="d">Una síntesis del relato según los testimonios coptos.</text>
<rect x="32" y="115" width="716" height="67" fill="#e5eee5"/><text x="49" y="142" class="h">Realidad primera y Barbelo</text><text x="49" y="168" class="d">Se describe el orden divino y sus manifestaciones.</text>
<rect x="32" y="194" width="716" height="67" fill="#e5eee5"/><text x="49" y="221" class="h">Sofía y el gobernante inferior</text><text x="49" y="247" class="d">Yaldabaot actúa sin conocer su origen superior.</text>
<rect x="32" y="273" width="716" height="67" fill="#e5eee5"/><text x="49" y="300" class="h">Formación humana</text><text x="49" y="326" class="d">El relato reelabora episodios y figuras del Génesis.</text>
<rect x="32" y="352" width="716" height="67" fill="#e5eee5"/><text x="49" y="379" class="h">Revelación</text><text x="49" y="405" class="d">Juan escucha una explicación del origen y del olvido.</text>
</svg>
