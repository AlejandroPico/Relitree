<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 509" role="img" aria-labelledby="tit des">
<title id="tit">De la residencia de Aviñón a Constanza</title><desc id="des">1309. Clemente V instala la corte en Aviñón. 1348. Clemente VI compra la ciudad a Juana de Nápoles. 1367–1370. Urbano V reside en Roma y vuelve al Ródano. 1377–1378. Gregorio XI regresa a Roma. Después de su muerte se abre el cisma. 1409. Pisa elige un tercer titular. 1417–1429. Elección de Martín V y epílogo de la obediencia de Peñíscola.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="509" fill="#ffffff"/>
<text x="26" y="37" class="title">De la residencia de Aviñón a Constanza</text>
<text x="26" y="68" class="sub">La mudanza y el cisma siguen cronologías distintas</text>
<rect x="26" y="102" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="58" fill="#365987" /><text x="44" y="129" class="label">1309</text><text x="246" y="129" class="event">Clemente V instala la corte en Aviñón.</text><rect x="26" y="165" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="165" width="4" height="58" fill="#365987" /><text x="44" y="192" class="label">1348</text><text x="246" y="192" class="event">Clemente VI compra la ciudad a Juana de Nápoles.</text><rect x="26" y="228" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="228" width="4" height="58" fill="#365987" /><text x="44" y="255" class="label">1367–1370</text><text x="246" y="255" class="event">Urbano V reside en Roma y vuelve al Ródano.</text><rect x="26" y="291" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="291" width="4" height="65" fill="#365987" /><text x="44" y="318" class="label">1377–1378</text><text x="246" y="318" class="event">Gregorio XI regresa a Roma. Después de su muerte se</text><text x="246" y="341" class="event">abre el cisma.</text><rect x="26" y="361" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="361" width="4" height="58" fill="#365987" /><text x="44" y="388" class="label">1409</text><text x="246" y="388" class="event">Pisa elige un tercer titular.</text><rect x="26" y="424" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="424" width="4" height="65" fill="#365987" /><text x="44" y="451" class="label">1417–1429</text><text x="246" y="451" class="event">Elección de Martín V y epílogo de la obediencia de</text><text x="246" y="474" class="event">Peñíscola.</text>
</svg>
