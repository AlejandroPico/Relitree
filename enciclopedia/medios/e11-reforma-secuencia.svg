<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 516" role="img" aria-labelledby="tit des">
<title id="tit">De Otón I a Pascual II</title><desc id="des">962–965. Coronación imperial y pontificados disputados en Roma. 999. Silvestre II gobierna en tiempos de Otón III. 1045–1048. Sucesiones rivales, Sutri y tercer acceso de Benedicto IX. 1054–1059. Censuras de 1054 y decreto electoral de Nicolás II. 1077–1085. Canossa, gobierno rival en Roma y muerte de Gregorio VII. 1095–1099. Clermont y elección de Pascual II.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
