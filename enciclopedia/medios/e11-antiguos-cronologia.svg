<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 453" role="img" aria-labelledby="tit des">
<title id="tit">Roma antes de Constantino</title><desc id="des">Finales del siglo I. La Iglesia de Roma escribe a los corintios. Finales del siglo II. Ireneo transmite una lista. Víctor interviene en la disputa pascual. 235. Ponciano y el presbítero Hipólito son deportados a Cerdeña. 250–258. Mueren Fabián bajo Decio y Sixto II bajo Valeriano. 303–304. Las medidas de la gran persecución alcanzan a la Iglesia romana.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="453" fill="#ffffff"/>
<text x="26" y="37" class="title">Roma antes de Constantino</text>
<text x="26" y="68" class="sub">Secuencia de hitos documentados</text>
<rect x="26" y="102" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="58" fill="#365987" /><text x="44" y="129" class="label">Finales del siglo I</text><text x="246" y="129" class="event">La Iglesia de Roma escribe a los corintios.</text><rect x="26" y="165" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="165" width="4" height="65" fill="#365987" /><text x="44" y="192" class="label">Finales del siglo II</text><text x="246" y="192" class="event">Ireneo transmite una lista. Víctor interviene en la</text><text x="246" y="215" class="event">disputa pascual.</text><rect x="26" y="235" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="235" width="4" height="65" fill="#365987" /><text x="44" y="262" class="label">235</text><text x="246" y="262" class="event">Ponciano y el presbítero Hipólito son deportados a</text><text x="246" y="285" class="event">Cerdeña.</text><rect x="26" y="305" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="305" width="4" height="58" fill="#365987" /><text x="44" y="332" class="label">250–258</text><text x="246" y="332" class="event">Mueren Fabián bajo Decio y Sixto II bajo Valeriano.</text><rect x="26" y="368" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="368" width="4" height="65" fill="#365987" /><text x="44" y="395" class="label">303–304</text><text x="246" y="395" class="event">Las medidas de la gran persecución alcanzan a la</text><text x="246" y="418" class="event">Iglesia romana.</text>
</svg>
