<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 397" role="img" aria-labelledby="tit des">
<title id="tit">Las tres obediencias del Cisma de Occidente</title><desc id="des">Roma. Urbano VI, Bonifacio IX, Inocencio VII y Gregorio XII, que renuncia en 1415. Aviñón. Clemente VII y Benedicto XIII, depuesto por el concilio en 1417. Pisa. Alejandro V ejerce desde 1409 y le sucede Juan XXIII, depuesto en 1415. Constanza. Martín V es elegido en 1417. La reclamación de Benedicto XIII continúa en Peñíscola.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="824" height="397" fill="#ffffff"/>
<text x="26" y="37" class="title">Las tres obediencias del Cisma de Occidente</text>
<text x="26" y="68" class="sub">1378–1417 · Cada color representa una línea de reconocimiento</text>
