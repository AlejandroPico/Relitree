<svg xmlns="http://www.w3.org/2000/svg" width="720" height="638" viewBox="0 0 720 638" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">La controversia de Calcedonia, 448–482</title>
  <desc id="descripcion">Cronología esquemática de siete hitos, desde el juicio de Eutiques hasta el Henotikon de Zenón. Destaca la redacción y la aprobación de la definición de fe.</desc>
  <rect width="720" height="638" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="51" font-size="31" font-weight="700">La controversia de Calcedonia</text>
    <text x="36" y="80" font-size="17" fill="#abc1d5">448–482 · Cronología esquemática</text>
    <path d="M 55,125 V 583" stroke="#6d879f" stroke-width="2"/>
    <g>
      <circle cx="55" cy="125" r="5" fill="#acd6f6"/>
      <text x="80" y="131" font-size="20" font-weight="700" fill="#acd6f6">448</text>
      <text x="225" y="131" font-size="22" font-weight="700">Sínodo de Constantinopla</text>
      <text x="225" y="159" font-size="16" fill="#c0d1e0">Flaviano preside el proceso contra Eutiques.</text>
    </g>
    <g>
      <circle cx="55" cy="201" r="5" fill="#acd6f6"/>
      <text x="80" y="207" font-size="20" font-weight="700" fill="#acd6f6">449</text>
      <text x="225" y="207" font-size="22" font-weight="700">Segunda asamblea de Éfeso</text>
      <text x="225" y="235" font-size="16" fill="#c0d1e0">Dióscoro preside la restitución de Eutiques.</text>
    </g>
    <g>
      <circle cx="55" cy="277" r="5" fill="#acd6f6"/>
      <text x="80" y="283" font-size="20" font-weight="700" fill="#acd6f6">8 oct. 451</text>
      <text x="225" y="283" font-size="22" font-weight="700">Apertura de Calcedonia</text>
      <text x="225" y="311" font-size="16" fill="#c0d1e0">La asamblea revisa las actas de 449.</text>
    </g>
    <g>
      <circle cx="55" cy="353" r="5" fill="#acd6f6"/>
      <text x="80" y="359" font-size="20" font-weight="700" fill="#acd6f6">13 oct. 451</text>
      <text x="225" y="359" font-size="22" font-weight="700">Juicio de Dióscoro</text>
      <text x="225" y="387" font-size="16" fill="#c0d1e0">Los obispos le deponen de la sede de Alejandría.</text>
    </g>
    <g>
      <circle cx="55" cy="429" r="8" fill="#ffd490"/>
      <text x="80" y="435" font-size="20" font-weight="700" fill="#ffd490">22 oct. 451</text>
      <text x="225" y="435" font-size="22" font-weight="700">Redacción de la definición</text>
      <text x="225" y="463" font-size="16" fill="#c0d1e0">La asamblea acuerda la fórmula de las dos naturalezas.</text>
    </g>
    <g>
      <circle cx="55" cy="505" r="8" fill="#ffd490"/>
      <text x="80" y="511" font-size="20" font-weight="700" fill="#ffd490">25 oct. 451</text>
      <text x="225" y="511" font-size="22" font-weight="700">Confirmación solemne</text>
      <text x="225" y="539" font-size="16" fill="#c0d1e0">Marciano y Pulqueria asisten a la lectura y aprobación.</text>
    </g>
    <g>
      <circle cx="55" cy="581" r="5" fill="#acd6f6"/>
      <text x="80" y="587" font-size="20" font-weight="700" fill="#acd6f6">482</text>
      <text x="225" y="587" font-size="22" font-weight="700">Henotikon de Zenón</text>
      <text x="225" y="615" font-size="16" fill="#c0d1e0">La corte intenta restablecer la comunión.</text>
    </g>
  </g>
</svg>
