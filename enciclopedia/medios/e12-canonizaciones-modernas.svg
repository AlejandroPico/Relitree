<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 469" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Vidas y reconocimientos</title>
<desc id="detalle">1552 → 1622. Muerte de Francisco Javier y canonización por Gregorio XV. 1582 → 1622. Muerte de Teresa de Jesús y canonización en la misma ceremonia. 1617 → 1671. Muerte de Rosa de Lima y canonización bajo Clemente X. 1639 → 1962. Muerte de Martín de Porres y canonización por Juan XXIII. 1680 → 2012. Muerte de Kateri Tekakwitha y canonización por Benedicto XVI.</desc>
