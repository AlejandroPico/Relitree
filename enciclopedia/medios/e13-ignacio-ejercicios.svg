<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 476" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Cuatro semanas de los Ejercicios</title>
<desc id="detalle">Primera semana. Examen de la vida, pecado, misericordia y conversión. Segunda semana. Contemplación de la vida de Cristo y discernimiento de una elección. Tercera semana. Contemplación de la pasión y participación afectiva en ella. Cuarta semana. Contemplación de la resurrección y de la alegría que suscita. Al final. Contemplación para alcanzar amor y preparación del regreso a la vida ordinaria.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="476" fill="white"/>
<text class="title" x="20" y="39">Cuatro semanas de los Ejercicios</text>
<text class="subtitle" x="20" y="70">La duración se adapta a la persona y a sus circunstancias</text>
<rect x="20" y="100" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">Primera semana</text>
<text x="267" y="125">Examen de la vida, pecado, misericordia y</text>
<text x="267" y="148">conversión.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">Segunda semana</text>
<text x="267" y="197">Contemplación de la vida de Cristo y</text>
<text x="267" y="220">discernimiento de una elección.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">Tercera semana</text>
<text x="267" y="269">Contemplación de la pasión y participación</text>
<text x="267" y="292">afectiva en ella.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">Cuarta semana</text>
<text x="267" y="341">Contemplación de la resurrección y de la</text>
<text x="267" y="364">alegría que suscita.</text>
<rect x="20" y="388" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="413">Al final</text>
<text x="267" y="413">Contemplación para alcanzar amor y preparación</text>
<text x="267" y="436">del regreso a la vida ordinaria.</text>
</svg>
