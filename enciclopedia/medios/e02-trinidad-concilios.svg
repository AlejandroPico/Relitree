<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-label="Debates trinitarios y cristológicos">
  <rect width="900" height="325" fill="#f6f0e2"/>
  <text x="32" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#30251c">Debates trinitarios y cristológicos</text>
  <rect x="32" y="72" width="836" height="45" fill="#fffbef"/><path d="M32 72v45" stroke="#985f25" stroke-width="4"/><text x="48" y="100" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">325 · Nicea</text><text x="259" y="100" font-family="sans-serif" font-size="16" fill="#30251c">Relación del Hijo con el Padre y lenguaje de la consustancialidad.</text>
  <rect x="32" y="132" width="836" height="45" fill="#e8dcc3"/><path d="M32 132v45" stroke="#985f25" stroke-width="4"/><text x="48" y="160" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">381 · Constantinopla</text><text x="259" y="160" font-family="sans-serif" font-size="16" fill="#30251c">Recepción de Nicea y lugar del Espíritu Santo en la confesión.</text>
  <rect x="32" y="192" width="836" height="45" fill="#fffbef"/><path d="M32 192v45" stroke="#985f25" stroke-width="4"/><text x="48" y="220" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">431 · Éfeso</text><text x="259" y="220" font-family="sans-serif" font-size="16" fill="#30251c">Unidad de Cristo y controversia sobre la expresión Madre de Dios.</text>
  <rect x="32" y="252" width="836" height="45" fill="#e8dcc3"/><path d="M32 252v45" stroke="#985f25" stroke-width="4"/><text x="48" y="280" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">451 · Calcedonia</text><text x="259" y="280" font-family="sans-serif" font-size="16" fill="#30251c">El mismo Cristo confesado en dos naturalezas.</text>
</svg>
