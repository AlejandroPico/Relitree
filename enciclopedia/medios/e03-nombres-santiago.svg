<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" viewBox="0 0 760 324" role="img" aria-labelledby="title desc">
<title id="title">Tres nombres de Santiago</title>
<desc id="desc">Hijo de Zebedeo. Hermano de Juan. Hechos 12 noticia su muerte bajo Agripa I. Hijo de Alfeo. Uno de los Doce. La identificación como el Menor pertenece a su recepción. De Jerusalén. Pablo lo llama hermano del Señor. Josefo lo vincula a una muerte bajo Anano.</desc>
<style>text{font:16px system-ui,sans-serif;fill:#19364a}.label{font-weight:660}.title{font-size:26px;font-weight:700}.subtitle{fill:#466577}</style>
<rect width="760" height="324" fill="white"/>
<text x="22" y="39" class="title">Tres nombres de Santiago</text><text x="23" y="67" class="subtitle">Los parentescos orientan la identificación</text>
<rect x="21" y="94" width="718" height="66" fill="#e9f3f6"/>
<rect x="21" y="94" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="120">Hijo de Zebedeo</text>
<text x="280" y="120">Hermano de Juan. Hechos 12 noticia su muerte bajo</text>
<text x="280" y="143">Agripa I.</text>
<rect x="21" y="166" width="718" height="66" fill="#f2f5fb"/>
<rect x="21" y="166" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="192">Hijo de Alfeo</text>
<text x="280" y="192">Uno de los Doce. La identificación como el Menor</text>
<text x="280" y="215">pertenece a su recepción.</text>
<rect x="21" y="238" width="718" height="66" fill="#e9f3f6"/>
<rect x="21" y="238" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="264">De Jerusalén</text>
<text x="280" y="264">Pablo lo llama hermano del Señor. Josefo lo</text>
<text x="280" y="287">vincula a una muerte bajo Anano.</text>
</svg>
