<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 397" role="img" aria-labelledby="tit des">
<title id="tit">Los primeros titulares en sus fuentes</title><desc id="des">1 Clemente. Carta de Roma a Corinto. La voz colectiva antecede a su atribución nominal. Ireneo. Lista romana del siglo II en un argumento sobre la transmisión apostólica. Cartas del siglo III. Remitentes y destinatarios fechables en controversias y persecuciones. Cripta de Calixto. Epígrafes y restos funerarios. La inscripción se coteja con la lista.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="397" fill="#ffffff"/>
<text x="26" y="37" class="title">Los primeros titulares en sus fuentes</text>
<text x="26" y="68" class="sub">Qué permite establecer cada testimonio</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">1 Clemente</text><text x="246" y="129" class="event">Carta de Roma a Corinto. La voz colectiva antecede</text><text x="246" y="152" class="event">a su atribución nominal.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">Ireneo</text><text x="246" y="199" class="event">Lista romana del siglo II en un argumento sobre la</text><text x="246" y="222" class="event">transmisión apostólica.</text><rect x="26" y="242" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="65" fill="#365987" /><text x="44" y="269" class="label">Cartas del siglo III</text><text x="246" y="269" class="event">Remitentes y destinatarios fechables en</text><text x="246" y="292" class="event">controversias y persecuciones.</text><rect x="26" y="312" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="312" width="4" height="65" fill="#365987" /><text x="44" y="339" class="label">Cripta de Calixto</text><text x="246" y="339" class="event">Epígrafes y restos funerarios. La inscripción se</text><text x="246" y="362" class="event">coteja con la lista.</text>
