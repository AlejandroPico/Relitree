<svg xmlns="http://www.w3.org/2000/svg" width="760" height="574" viewBox="0 0 760 574" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Las imágenes en disputa</title>
  <desc id="descripcion">Seis hitos desde Hieria hasta 843. Se distinguen la definición de Nicea en 787 y la segunda restauración de las imágenes en 843.</desc>
  <rect width="760" height="574" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="51" font-size="30" font-weight="700">Las imágenes en disputa</text>
    <text x="36" y="81" font-size="17" fill="#abc1d5">754–843 · Cronología esquemática</text>
    <path d="M 55 125 V 505" stroke="#6d879f" stroke-width="2"/>
    <g>
      <circle cx="55" cy="125" r="5" fill="#acd6f6"/>
      <text x="79" y="131" font-size="20" font-weight="700" fill="#acd6f6">754</text>
      <text x="212" y="131" font-size="22" font-weight="700">Concilio de Hieria</text>
      <text x="212" y="159" font-size="16" fill="#c0d1e0">La asamblea de Constantino V impugna el uso de iconos.</text>
    </g>
    <g>
      <circle cx="55" cy="201" r="5" fill="#acd6f6"/>
      <text x="79" y="207" font-size="20" font-weight="700" fill="#acd6f6">786</text>
      <text x="212" y="207" font-size="22" font-weight="700">Convocatoria interrumpida</text>
      <text x="212" y="235" font-size="16" fill="#c0d1e0">Una intervención militar frustra la reunión en la capital.</text>
    </g>
    <g>
      <circle cx="55" cy="277" r="8" fill="#ffd490"/>
      <text x="79" y="283" font-size="20" font-weight="700" fill="#ffd490">787</text>
      <text x="212" y="283" font-size="22" font-weight="700">Concilio de Nicea II</text>
      <text x="212" y="311" font-size="16" fill="#c0d1e0">La definición restablece el honor a las imágenes.</text>
    </g>
    <g>
      <circle cx="55" cy="353" r="5" fill="#acd6f6"/>
      <text x="79" y="359" font-size="20" font-weight="700" fill="#acd6f6">794</text>
      <text x="212" y="359" font-size="22" font-weight="700">Concilio de Frankfurt</text>
      <text x="212" y="387" font-size="16" fill="#c0d1e0">Los obispos francos objetan la doctrina que atribuyen a Nicea.</text>
    </g>
    <g>
      <circle cx="55" cy="429" r="5" fill="#acd6f6"/>
      <text x="79" y="435" font-size="20" font-weight="700" fill="#acd6f6">815</text>
      <text x="212" y="435" font-size="22" font-weight="700">Segunda iconoclasia</text>
      <text x="212" y="463" font-size="16" fill="#c0d1e0">León V reactiva la prohibición oficial.</text>
    </g>
    <g>
      <circle cx="55" cy="505" r="8" fill="#ffd490"/>
      <text x="79" y="511" font-size="20" font-weight="700" fill="#ffd490">843</text>
      <text x="212" y="511" font-size="22" font-weight="700">Restauración en Constantinopla</text>
      <text x="212" y="539" font-size="16" fill="#c0d1e0">Teodora y Metodio restituyen el honor a los iconos.</text>
    </g>
  </g>
</svg>
