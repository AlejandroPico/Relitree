<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 693" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Itinerario de Ignacio de Loyola</title>
<desc id="detalle">1521–1523. Pamplona, Loyola, Montserrat, Manresa y peregrinación a Jerusalén. 1524–1527. Barcelona, Alcalá de Henares y Salamanca. 1528–1535. Estudios en París y votos de Montmartre de 1534. 1537–1556. Ordenación en Venecia, llegada a Roma y fundación de la Compañía.</desc>
