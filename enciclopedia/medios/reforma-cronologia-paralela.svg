<svg xmlns="http://www.w3.org/2000/svg" width="820" viewBox="0 0 820 622" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reformas del siglo XVI · Cronología en paralelo</title>
  <desc id="descripcion">1517–1529. Sacro Imperio: 1517 · Tesis de Lutero, 1521 · Worms, 1529 · Espira. Suiza y Ginebra: 1523 · Debate de Zúrich, 1525 · Bautismos de creyentes, 1529 · Marburgo. 1530–1544. Sacro Imperio: 1530 · Confesión de Augsburgo, 1534 · Biblia de Lutero. Suiza y Ginebra: 1531 · Kappel, 1536 · Calvino llega a Ginebra. Inglaterra: 1534 · Supremacía de Enrique VIII. Reforma católica: 1540 · Aprobación de la Compañía de Jesús. 1545–1563. Sacro Imperio: 1555 · Paz de Augsburgo. Suiza y Ginebra: 1549 · Acuerdo de Zúrich sobre la Cena. Inglaterra: 1549 · Libro de Oración Común, 1559 · Acuerdo isabelino. Reforma católica: 1545–1563 · Concilio de Trento</desc>
