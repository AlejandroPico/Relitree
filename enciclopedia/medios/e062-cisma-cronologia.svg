<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 661" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Roma y Constantinopla</title>
  <desc id="descripcion">Fechas ordenadas. Los intervalos no se muestran a escala proporcional.</desc>
  <rect width="680" height="661" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #202a2a }
    .title { font-size: 30px; font-weight: 720 }
    .small { font-size: 17px; fill: #465553 }
    .date { font-size: 21px; fill: #175d54; font-weight: 700 }
    .item { font-size: 21px; font-weight: 550 }
    .label { font-size: 21px; font-weight: 700 }
  </style>
  <text x="34" y="46" class="title">Roma y Constantinopla</text>
  <text x="34" y="76" class="small">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M 174 113 V 603" stroke="#678c83" stroke-width="3"/>
  <text x="150" y="120" text-anchor="end" class="date">869–870</text>
  <circle cx="174" cy="113" r="6" fill="#267868"/>
  <text x="195" y="120" class="item">Concilio contra Focio</text>
  <text x="150" y="169" text-anchor="end" class="date">879–880</text>
  <circle cx="174" cy="162" r="6" fill="#267868"/>
  <text x="195" y="169" class="item">Focio y los legados se reúnen</text>
  <text x="150" y="218" text-anchor="end" class="date">1053</text>
  <circle cx="174" cy="211" r="6" fill="#267868"/>
  <text x="195" y="218" class="item">Carta de León de Ohrid a Trani</text>
  <text x="150" y="267" text-anchor="end" class="date">1054</text>
  <circle cx="174" cy="260" r="6" fill="#267868"/>
  <text x="195" y="267" class="item">Condenas personales en Constantinopla</text>
  <text x="150" y="316" text-anchor="end" class="date">1204</text>
  <circle cx="174" cy="309" r="6" fill="#267868"/>
  <text x="195" y="316" class="item">Los cruzados toman Constantinopla</text>
  <text x="150" y="365" text-anchor="end" class="date">1274</text>
  <circle cx="174" cy="358" r="6" fill="#267868"/>
