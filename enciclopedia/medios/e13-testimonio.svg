<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 476" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Cómo leer un caso de aparición</title>
<desc id="detalle">Experiencia relatada. Identificar cuándo y dónde sitúa el encuentro el testigo. Registro. Fechar la primera declaración conservada, sus copias y traducciones. Culto y peregrinación. Estudiar imágenes, lugares, celebraciones y públicos. Pronunciamiento. Leer la decisión, su autoridad y las prácticas que contempla. Recepción. Comprobar cómo se difundió y cómo cambió la atención pastoral.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="476" fill="white"/>
<text class="title" x="20" y="39">Cómo leer un caso de aparición</text>
<text class="subtitle" x="20" y="70">Cinco momentos que pueden tener fechas distintas</text>
<rect x="20" y="100" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">Experiencia relatada</text>
<text x="267" y="125">Identificar cuándo y dónde sitúa el encuentro</text>
<text x="267" y="148">el testigo.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">Registro</text>
<text x="267" y="197">Fechar la primera declaración conservada, sus</text>
<text x="267" y="220">copias y traducciones.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">Culto y peregrinación</text>
<text x="267" y="269">Estudiar imágenes, lugares, celebraciones y</text>
<text x="267" y="292">públicos.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">Pronunciamiento</text>
<text x="267" y="341">Leer la decisión, su autoridad y las prácticas</text>
<text x="267" y="364">que contempla.</text>
<rect x="20" y="388" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="413">Recepción</text>
<text x="267" y="413">Comprobar cómo se difundió y cómo cambió la</text>
<text x="267" y="436">atención pastoral.</text>
</svg>
