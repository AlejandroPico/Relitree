<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Qué documenta cada archivo</title>
<desc id="descripcion">Qué documenta cada archivo. Contratos y normas. Venta, filiación, manumisión y facultades de un propietario. Registros parroquiales. Bautismo, vínculos familiares y datos de identificación. Relatos y reclamaciones. Experiencia propia, estrategias de libertad y crítica de la esclavitud.</desc>
