<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 487" role="img" aria-labelledby="title description">
  <title id="title">Las cruzadas numeradas</title>
  <desc id="description">1096–1099. Primera · conquista de Jerusalén. 1147–1149. Segunda · Damasco, Lisboa y Báltico occidental. 1189–1192. Tercera · recuperación de Acre. 1202–1204. Cuarta · saqueo de Constantinopla. 1217–1221. Quinta · ocupación y pérdida de Damieta. 1228–1229. Sexta · acuerdo sobre Jerusalén. 1248–1254. Séptima · campaña de Luis IX en Egipto. 1270. Octava · expedición de Luis IX a Túnez. 1291. Caída de Acre ante los mamelucos</desc>
  <rect width="760" height="487" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill:#23302d }
    .title { font-size:28px; font-weight:730 }
    .note { font-size:16px; fill:#435653 }
    .date { font-size:19px; font-weight:700; fill:#165d53 }
    .item { font-size:19px; font-weight:550 }
    .head { font-size:22px; font-weight:680 }
    .place { font-size:17px; font-weight:700; paint-order:stroke; stroke:#f7f4ec; stroke-width:4; stroke-linejoin:round }
    .water { font-size:17px; fill:#456672; font-style:italic }
  </style>
  <text x="30" y="45" class="title">Las cruzadas numeradas</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
