<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Tres escalas de la expansión</title>
<desc id="descripcion">Tres escalas de la expansión. Gobierno y patronazgo. Actas, concesiones y correspondencia. Indican quién tuvo autoridad para apoyar una fundación. Instituciones. Registros, cuentas y edificios. Permiten seguir los recursos y el trabajo de una iglesia. Hogares y asociaciones. Peticiones, objetos y testimonios. Muestran usos de las nuevas prácticas y sus cambios.</desc>
<rect width="720" height="456" fill="#fbf8ef"/>
<g font-family="system-ui, sans-serif">
<text x="34" y="52" font-size="31" font-weight="700" fill="#243238" text-anchor="start">Tres escalas de la expansión</text>
<text x="35" y="87" font-size="22" font-weight="400" fill="#46575d" text-anchor="start">Qué permite observar cada fuente</text>
<path d="M36 120v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="137" r="8" fill="#385b6b"/>
<text x="61" y="145" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Gobierno y patronazgo</text>
<text x="61" y="173" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Actas, concesiones y correspondencia. Indican quién</text>
<text x="61" y="197" font-size="22" font-weight="400" fill="#243238" text-anchor="start">tuvo autoridad para apoyar una fundación.</text>
<path d="M36 229v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="246" r="8" fill="#385b6b"/>
<text x="61" y="254" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Instituciones</text>
<text x="61" y="282" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Registros, cuentas y edificios. Permiten seguir los</text>
<text x="61" y="306" font-size="22" font-weight="400" fill="#243238" text-anchor="start">recursos y el trabajo de una iglesia.</text>
<path d="M36 338v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="355" r="8" fill="#385b6b"/>
<text x="61" y="363" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Hogares y asociaciones</text>
<text x="61" y="391" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Peticiones, objetos y testimonios. Muestran usos de</text>
<text x="61" y="415" font-size="22" font-weight="400" fill="#243238" text-anchor="start">las nuevas prácticas y sus cambios.</text>
</g>
</svg>
