<rect width="740" height="390" fill="#ffffff"/>
<text x="26" y="37" class="title">Tres cambios en la elección pontificia</text>
<text x="26" y="68" class="sub">Reglas y conflictos que las precedieron</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">1059</text><text x="246" y="129" class="event">Los cardenales obispos adquieren iniciativa en la</text><text x="246" y="152" class="event">elección.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">1179</text><text x="246" y="199" class="event">Letrán III establece mayoría de dos tercios de los</text><text x="246" y="222" class="event">cardenales.</text><rect x="26" y="242" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="65" fill="#365987" /><text x="44" y="269" class="label">1274</text><text x="246" y="269" class="event">Lyon II regula la reclusión después de la larga</text><text x="246" y="292" class="event">vacante de Viterbo.</text><rect x="26" y="312" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="312" width="4" height="58" fill="#365987" /><text x="44" y="339" class="label">1276</text><text x="246" y="339" class="event">La aplicación de las reglas de Lyon se suspende.</text>
