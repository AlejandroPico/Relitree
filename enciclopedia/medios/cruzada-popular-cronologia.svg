  <circle cx="173" cy="320" r="6" fill="#277268"/>
  <text x="200" y="326" class="item">Derrotas cerca de Merzifon y Heraclea</text>
  <text x="151" y="369" class="date" text-anchor="end">1102</text>
  <circle cx="173" cy="363" r="6" fill="#277268"/>
