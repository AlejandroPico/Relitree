<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 429" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Cuatro trayectorias del cristianismo africano</title><desc id="descripcion">Cuatro trayectorias del cristianismo africano. Instituciones y formas de continuidad. Tewahedo · Etiopía y Eritrea. Liturgia, monasterios, parroquias y comunidades diaspóricas. Catolicismo · episcopados africanos. Diócesis y coordinación continental, SECAM desde 1969. Kimbanguismo · Congo. Predicación desde 1921, reconocimiento en 1959 y CMI en 1969. Pentecostalismos · Ghana y Nigeria. Congregaciones locales, medios y redes de alcance internacional.</desc>
<rect width="720" height="429" fill="#f7faf9"/>
<g font-family="system-ui, sans-serif">
<text x="36" y="49" font-size="26" font-weight="700" fill="#253c43" text-anchor="start">Cuatro trayectorias del cristianismo africano</text>
<text x="36" y="82" font-size="21" font-weight="400" fill="#253c43" text-anchor="start">Instituciones y formas de continuidad</text>
<rect x="34" y="113" width="652" height="63" rx="3" fill="#e7efed"/>
<rect x="34" y="113" width="5" height="63" fill="#3b756d"/>
<text x="50" y="137" font-size="20" font-weight="700" fill="#253c43" text-anchor="start">Tewahedo · Etiopía y Eritrea</text>
<text x="50" y="162" font-size="19" font-weight="400" fill="#253c43" text-anchor="start">Liturgia, monasterios, parroquias y comunidades diaspóricas.</text>
<rect x="34" y="188" width="652" height="63" rx="3" fill="#e7efed"/>
<rect x="34" y="188" width="5" height="63" fill="#3b756d"/>
<text x="50" y="212" font-size="20" font-weight="700" fill="#253c43" text-anchor="start">Catolicismo · episcopados africanos</text>
<text x="50" y="237" font-size="19" font-weight="400" fill="#253c43" text-anchor="start">Diócesis y coordinación continental, SECAM desde 1969.</text>
<rect x="34" y="263" width="652" height="63" rx="3" fill="#e7efed"/>
<rect x="34" y="263" width="5" height="63" fill="#3b756d"/>
<text x="50" y="287" font-size="20" font-weight="700" fill="#253c43" text-anchor="start">Kimbanguismo · Congo</text>
<text x="50" y="312" font-size="19" font-weight="400" fill="#253c43" text-anchor="start">Predicación desde 1921, reconocimiento en 1959 y CMI en 1969.</text>
<rect x="34" y="338" width="652" height="63" rx="3" fill="#e7efed"/>
<rect x="34" y="338" width="5" height="63" fill="#3b756d"/>
<text x="50" y="362" font-size="20" font-weight="700" fill="#253c43" text-anchor="start">Pentecostalismos · Ghana y Nigeria</text>
<text x="50" y="387" font-size="19" font-weight="400" fill="#253c43" text-anchor="start">Congregaciones locales, medios y redes de alcance internacional.</text>
