<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 620" role="img" aria-labelledby="titulo detalle">
<title id="titulo">La sede de Constantinopla</title>
<desc id="detalle">381 y 451. Constantinopla I y Calcedonia fijan precedencia y atribuciones. 1204–1261. Conquista latina, sede ortodoxa en Nicea y regreso a Constantinopla. 1453–1454. Conquista otomana y patriarcado de Genadio II Escolario. Siglo XIX. Reformas otomanas, reglamentos y reorganización eclesiástica. 1920–1923. Carta ecuménica y Convenio de Lausana sobre intercambio de poblaciones. 1964–1965. Encuentro de Atenágoras y Pablo VI y declaración conjunta. 2016–2019. Concilio de Creta y tomos de autocefalia para la Iglesia ortodoxa de Ucrania.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="620" fill="white"/>
