<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 765" role="img" aria-labelledby="titulo detalle">
<title id="titulo">La formación y los destinos de Tomás</title>
<desc id="detalle">Montecasino y Nápoles. Formación inicial y elección de la orden dominicana. París y Colonia. Estudios en el entorno de Alberto Magno. París · década de 1250. Comentario a las Sentencias y actividad como maestro. Italia y París · 1259–1272. Docencia, grandes tratados y disputas universitarias. Nápoles y Fossanova. Última etapa de enseñanza. Muere en 1274 camino de Lyon.</desc>
