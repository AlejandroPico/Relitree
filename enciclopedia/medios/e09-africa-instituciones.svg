<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 429" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Cómo funcionaba un puesto misionero</title><desc id="descripcion">Cómo funcionaba un puesto misionero. Participantes, recursos y decisiones concretas. Autoridades y propietarios. Residencia, adjudicación del suelo y reconocimiento escolar. Red misionera. Pasajes, equipamiento, informes y nombramientos. Maestros y empleados locales. Formación, traducción, enseñanza y atención cotidiana. Congregaciones y familias. Trabajo, alojamiento, matrículas y aportaciones.</desc>
<rect width="720" height="429" fill="#f7faf9"/>
<g font-family="system-ui, sans-serif">
