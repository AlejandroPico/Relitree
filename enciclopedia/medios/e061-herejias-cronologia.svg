<svg xmlns="http://www.w3.org/2000/svg" width="640" viewBox="0 0 640 687" role="img" aria-labelledby="grafico-titulo grafico-desc">
  <title id="grafico-titulo">Controversias cristianas antiguas</title>
  <desc id="grafico-desc">Once hitos cronológicos desde Ireneo de Lyon hasta Constantinopla III. El círculo abierto indica fecha aproximada.</desc>
  <rect width="640" height="687" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #202a2a }
    .title { font-size: 30px; font-weight: 720 }
    .sub { font-size: 16px; fill: #465553 }
    .date { font-size: 20px; fill: #175d54; font-weight: 700 }
    .item { font-size: 20px; font-weight: 550 }
    .label { font-size: 18px; font-weight: 700 }
    .note { font-size: 16px }
  </style>
  <text x="32" y="46" class="title">Controversias cristianas antiguas</text>
  <text x="32" y="74" class="sub">Hitos en orden cronológico · intervalos sin escala proporcional</text>
  <path d="M 185 112 V 622" stroke="#678c83" stroke-width="3"/>
  <text x="161" y="119" text-anchor="end" class="date">c. 180</text>
  <circle cx="185" cy="112" r="6" fill="#f7f4ec" stroke="#267868" stroke-width="2"/>
  <text x="206" y="119" class="item">Ireneo escribe contra las herejías</text>
  <text x="161" y="170" text-anchor="end" class="date">251</text>
  <circle cx="185" cy="163" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="170" class="item">Cornelio y Novaciano en Roma</text>
  <text x="161" y="221" text-anchor="end" class="date">325</text>
  <circle cx="185" cy="214" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="221" class="item">Nicea I y el credo sobre el Hijo</text>
  <text x="161" y="272" text-anchor="end" class="date">380–381</text>
  <circle cx="185" cy="265" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="272" class="item">Edicto y Constantinopla I</text>
  <text x="161" y="323" text-anchor="end" class="date">c. 385</text>
  <circle cx="185" cy="316" r="6" fill="#f7f4ec" stroke="#267868" stroke-width="2"/>
  <text x="206" y="323" class="item">Ejecución de Prisciliano</text>
  <text x="161" y="374" text-anchor="end" class="date">411</text>
  <circle cx="185" cy="367" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="374" class="item">Conferencia de Cartago</text>
  <text x="161" y="425" text-anchor="end" class="date">418</text>
  <circle cx="185" cy="418" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="425" class="item">Condenas contra tesis pelagianas</text>
  <text x="161" y="476" text-anchor="end" class="date">431</text>
  <circle cx="185" cy="469" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="476" class="item">Concilio de Éfeso</text>
  <text x="161" y="527" text-anchor="end" class="date">451</text>
  <circle cx="185" cy="520" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="527" class="item">Concilio de Calcedonia</text>
  <text x="161" y="578" text-anchor="end" class="date">553</text>
  <circle cx="185" cy="571" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="578" class="item">Condena de los Tres Capítulos</text>
  <text x="161" y="629" text-anchor="end" class="date">680–681</text>
  <circle cx="185" cy="622" r="6" fill="#267868" stroke="#267868" stroke-width="2"/>
  <text x="206" y="629" class="item">Dos voluntades en Cristo</text>
</svg>
