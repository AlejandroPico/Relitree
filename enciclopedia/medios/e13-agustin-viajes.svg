<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 837" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Los itinerarios de Agustín</title>
<desc id="detalle">354 · Tagaste. Nacimiento en el África romana, actual Souk Ahras. Madaura y Cartago. Estudios, lectura de Cicerón y vínculo con el maniqueísmo. 383–384 · Roma y Milán. Viaja a Italia y obtiene una cátedra de retórica. 387 · Milán y Ostia. Bautismo por Ambrosio y muerte de Mónica durante el regreso. Desde 391 · Hipona. Ordenación, episcopado y controversias africanas. 430 · Hipona. Muere durante el asedio de los vándalos.</desc>
