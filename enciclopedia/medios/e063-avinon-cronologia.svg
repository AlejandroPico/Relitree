<svg xmlns="http://www.w3.org/2000/svg" width="690" viewBox="0 0 690 592" role="img" aria-labelledby="tit desc">
  <title id="tit">El papado de Aviñón</title>
  <desc id="desc">Fechas en orden cronológico, intervalos sin escala proporcional.</desc>
  <rect width="690" height="592" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui,sans-serif; fill:#202a2a }
    .title { font-size:29px; font-weight:720 }
    .note { font-size:17px; fill:#465553 }
    .date { font-size:21px; fill:#175d54; font-weight:700 }
