<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" viewBox="0 0 760 376" role="img" aria-labelledby="title desc">
<title id="title">Cómo se documenta un símbolo</title><desc id="desc">Objeto. Registrar soporte, medidas, estado e inscripciones. Contexto. Datar la pieza y comprobar dónde se usaba y quién podía verla. Comparación. Buscar objetos fechados y textos pertinentes para cada rasgo. Conclusión. Indicar qué se puede demostrar y qué queda como hipótesis.</desc>
