<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 523" role="img" aria-labelledby="tit des">
<title id="tit">Papas, concilios y poderes de los siglos XII–XIII</title><desc id="des">1122–1139. Worms y dos concilios de Letrán, uno después de la elección dividida de 1130. 1159–1179. Elección rival, paz de Venecia y regla de los dos tercios. 1215. Letrán IV se reúne bajo Inocencio III. 1245. Lyon I declara depuesto a Federico II. 1274. Lyon II regula el cónclave y proclama una unión de corta recepción. 1294–1303. Renuncia de Celestino V, jubileo de 1300 y ataque de Anagni.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="523" fill="#ffffff"/>
<text x="26" y="37" class="title">Papas, concilios y poderes de los siglos XII–XIII</text>
<text x="26" y="68" class="sub">Cronología selectiva</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">1122–1139</text><text x="246" y="129" class="event">Worms y dos concilios de Letrán, uno después de la</text><text x="246" y="152" class="event">elección dividida de 1130.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">1159–1179</text><text x="246" y="199" class="event">Elección rival, paz de Venecia y regla de los dos</text><text x="246" y="222" class="event">tercios.</text><rect x="26" y="242" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="58" fill="#365987" /><text x="44" y="269" class="label">1215</text><text x="246" y="269" class="event">Letrán IV se reúne bajo Inocencio III.</text><rect x="26" y="305" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="305" width="4" height="58" fill="#365987" /><text x="44" y="332" class="label">1245</text><text x="246" y="332" class="event">Lyon I declara depuesto a Federico II.</text><rect x="26" y="368" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="368" width="4" height="65" fill="#365987" /><text x="44" y="395" class="label">1274</text><text x="246" y="395" class="event">Lyon II regula el cónclave y proclama una unión de</text><text x="246" y="418" class="event">corta recepción.</text><rect x="26" y="438" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="438" width="4" height="65" fill="#365987" /><text x="44" y="465" class="label">1294–1303</text><text x="246" y="465" class="event">Renuncia de Celestino V, jubileo de 1300 y ataque</text><text x="246" y="488" class="event">de Anagni.</text>
