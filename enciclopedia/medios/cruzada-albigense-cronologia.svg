<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 493" role="img" aria-labelledby="title description">
  <title id="title">Cruzada albigense · Cronología</title>
  <desc id="description">1208. Asesinato del legado Pedro de Castelnau. 1209. Toma de Béziers y Carcasona. 1210–1211. Sitios de Minerve, Termes y Lavaur. 1213. Victoria de Montfort en Muret y muerte de Pedro II. 1215. El IV Concilio de Letrán trata la disputa por Toulouse. 1217–1218. Regreso del conde y muerte de Montfort en el sitio. 1226. Expedición de Luis VIII y sitio de Aviñón. 1229. Paz de Meaux-París con Raimundo VII</desc>
  <rect width="760" height="493" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #243532 }
    .title { font-size: 27px; font-weight: 720 }
    .note { font-size: 15px; fill: #435653 }
    .date { font-size: 17px; font-weight: 700; fill: #165d53 }
    .item { font-size: 18px; font-weight: 520 }
    .place { font-size: 16px; font-weight: 650; paint-order: stroke; stroke: #f7f4ec; stroke-width: 3px; stroke-linejoin: round }
    .water { font-size: 17px; font-weight: 570; fill: #466875; font-style: italic }
  </style>
  <text x="28" y="45" class="title">Cruzada albigense · Cronología</text>
  <text x="28" y="73" class="note">Hitos seleccionados · intervalos sin escala proporcional</text>
  <path d="M213 117V460" stroke="#8ca39c" stroke-width="3"/>
