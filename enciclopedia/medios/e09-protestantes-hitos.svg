<title id="titulo">Serampore, el Pacífico y Edimburgo</title><desc id="descripcion">Serampore, el Pacífico y Edimburgo. Hitos del largo siglo XIX misionero. 1792–1810 · Gran Bretaña y EE. UU.. Fundación de la BMS, la LMS, la CMS y el American Board. 1818 · Serampore. Fundación del colegio bautista en Bengala. 1820–1831 · Hawái. Llegada del American Board y fundación de Lahainaluna. 1865 · China. Fundación de la China Inland Mission. 1910 · Edimburgo. Conferencia y propuestas de cooperación misionera.</desc>
