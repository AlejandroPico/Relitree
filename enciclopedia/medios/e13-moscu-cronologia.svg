<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 681" role="img" aria-labelledby="titulo detalle">
<title id="titulo">La sede de Moscú</title>
<desc id="detalle">988 y 1448. Cristianización vinculada a Kiev y elección de Jonás en Moscú. 1589–1593. Reconocimiento de Job y confirmación del lugar de la sede. 1666–1667. Deposición de Nikon y confirmación de la reforma litúrgica. 1721–1917. Periodo sinodal con supervisión imperial. 1917–1918. Concilio y restauración del patriarcado con Tijón. 1943. Elección de Sergio tras el cambio de política soviética en la guerra. 1970 y 2007. Tomos de la Iglesia ortodoxa en América y acta con la Iglesia rusa fuera de Rusia. 2018–2019. Disputa entre las sedes de Moscú y Constantinopla en torno a Ucrania.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="681" fill="white"/>
