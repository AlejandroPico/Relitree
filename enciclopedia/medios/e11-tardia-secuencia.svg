<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 523" role="img" aria-labelledby="tit des">
<title id="tit">De la tolerancia a Gregorio Magno</title><desc id="des">313–325. Arreglo de tolerancia; audiencia episcopal en Roma; Nicea. 366. Elección disputada entre Dámaso y Ursino. 431–451. Éfeso y Calcedonia. Roma envía delegaciones. 484–519. Ruptura de Acacio y restablecimiento de la comunión. 553. Concilio de Constantinopla y disputa de los Tres Capítulos. 590–604. Gregorio I gobierna Roma y mantiene redes de correspondencia.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="523" fill="#ffffff"/>
<text x="26" y="37" class="title">De la tolerancia a Gregorio Magno</text>
<text x="26" y="68" class="sub">Cronología selectiva de los siglos IV–VI</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">313–325</text><text x="246" y="129" class="event">Arreglo de tolerancia; audiencia episcopal en Roma;</text><text x="246" y="152" class="event">Nicea.</text><rect x="26" y="172" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="58" fill="#365987" /><text x="44" y="199" class="label">366</text><text x="246" y="199" class="event">Elección disputada entre Dámaso y Ursino.</text><rect x="26" y="235" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="235" width="4" height="58" fill="#365987" /><text x="44" y="262" class="label">431–451</text><text x="246" y="262" class="event">Éfeso y Calcedonia. Roma envía delegaciones.</text><rect x="26" y="298" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="298" width="4" height="65" fill="#365987" /><text x="44" y="325" class="label">484–519</text><text x="246" y="325" class="event">Ruptura de Acacio y restablecimiento de la</text><text x="246" y="348" class="event">comunión.</text><rect x="26" y="368" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="368" width="4" height="65" fill="#365987" /><text x="44" y="395" class="label">553</text><text x="246" y="395" class="event">Concilio de Constantinopla y disputa de los Tres</text><text x="246" y="418" class="event">Capítulos.</text><rect x="26" y="438" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="438" width="4" height="65" fill="#365987" /><text x="44" y="465" class="label">590–604</text><text x="246" y="465" class="event">Gregorio I gobierna Roma y mantiene redes de</text><text x="246" y="488" class="event">correspondencia.</text>
