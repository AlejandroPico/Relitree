  <text x="237" y="123" class="item"><tspan x="237" dy="0">Asesinato del legado Pedro de Castelnau</tspan></text>
  <text x="194" y="168" class="date" text-anchor="end">1209</text>
  <circle cx="213" cy="162" r="5" fill="#267568"/>
  <text x="237" y="168" class="item"><tspan x="237" dy="0">Toma de Béziers y Carcasona</tspan></text>
  <text x="194" y="213" class="date" text-anchor="end">1210–1211</text>
  <circle cx="213" cy="207" r="5" fill="#267568"/>
  <text x="237" y="213" class="item"><tspan x="237" dy="0">Sitios de Minerve, Termes y Lavaur</tspan></text>
  <text x="194" y="258" class="date" text-anchor="end">1213</text>
