<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 265" role="img" aria-label="Canon, texto y traducción">
  <rect width="900" height="265" fill="#f6f0e2"/>
  <text x="32" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#30251c">Canon, texto y traducción</text>
  <rect x="32" y="72" width="836" height="45" fill="#fffbef"/><path d="M32 72v45" stroke="#985f25" stroke-width="4"/><text x="48" y="100" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">Canon</text><text x="259" y="100" font-family="sans-serif" font-size="16" fill="#30251c">¿Qué escritos se recibieron? Listas, usos y decisiones comunitarias.</text>
  <rect x="32" y="132" width="836" height="45" fill="#e8dcc3"/><path d="M32 132v45" stroke="#985f25" stroke-width="4"/><text x="48" y="160" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">Transmisión textual</text><text x="259" y="160" font-family="sans-serif" font-size="16" fill="#30251c">¿Qué lectura se copió? Manuscritos, testigos y correcciones.</text>
  <rect x="32" y="192" width="836" height="45" fill="#fffbef"/><path d="M32 192v45" stroke="#985f25" stroke-width="4"/><text x="48" y="220" font-family="sans-serif" font-size="16" font-weight="700" fill="#30251c">Traducción</text><text x="259" y="220" font-family="sans-serif" font-size="16" fill="#30251c">¿Cómo se expresó en otra lengua? Versiones, léxico y notas.</text>
</svg>
