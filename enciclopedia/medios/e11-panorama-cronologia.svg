<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 530" role="img" aria-labelledby="tit des">
<title id="tit">Del episcopado romano al papado contemporáneo</title><desc id="des">Siglos I–III. Memoria de Pedro y Pablo, listas y redes de iglesias. Siglos IV–VI. Basílicas y concilios imperiales. Desarrollo de competencias romanas. Siglos VIII–IX. Alianza franca y gobierno de un territorio en Italia. Siglos XI–XIII. Reformas, jueces delegados, cardenales y concilios. 1309–1417. Aviñón, retorno a Roma, obediencias rivales y elección de Martín V. 1870–1929. Fin de los Estados Pontificios y creación del Estado vaticano.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="530" fill="#ffffff"/>
<text x="26" y="37" class="title">Del episcopado romano al papado contemporáneo</text>
<text x="26" y="68" class="sub">Periodos de transformación</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">Siglos I–III</text><text x="246" y="129" class="event">Memoria de Pedro y Pablo, listas y redes de</text><text x="246" y="152" class="event">iglesias.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">Siglos IV–VI</text><text x="246" y="199" class="event">Basílicas y concilios imperiales. Desarrollo de</text><text x="246" y="222" class="event">competencias romanas.</text><rect x="26" y="242" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="65" fill="#365987" /><text x="44" y="269" class="label">Siglos VIII–IX</text><text x="246" y="269" class="event">Alianza franca y gobierno de un territorio en</text><text x="246" y="292" class="event">Italia.</text><rect x="26" y="312" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="312" width="4" height="58" fill="#365987" /><text x="44" y="339" class="label">Siglos XI–XIII</text><text x="246" y="339" class="event">Reformas, jueces delegados, cardenales y concilios.</text><rect x="26" y="375" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="375" width="4" height="65" fill="#365987" /><text x="44" y="402" class="label">1309–1417</text><text x="246" y="402" class="event">Aviñón, retorno a Roma, obediencias rivales y</text><text x="246" y="425" class="event">elección de Martín V.</text><rect x="26" y="445" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="445" width="4" height="65" fill="#365987" /><text x="44" y="472" class="label">1870–1929</text><text x="246" y="472" class="event">Fin de los Estados Pontificios y creación del</text><text x="246" y="495" class="event">Estado vaticano.</text>
