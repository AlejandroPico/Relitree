<svg xmlns="http://www.w3.org/2000/svg" width="760" height="497" viewBox="0 0 760 497" role="img" aria-labelledby="title desc">
<title id="title">Cuatro signos y sus contextos</title><desc id="desc">1 · Cruz. El contorno y el contexto ayudan a precisar qué uso recibió. 2 · Crismón. Superposición de ji y rho, iniciales de Christós. 3 · Anj. Jeroglífico egipcio relacionado con la vida. En Egipto cristiano existen cruces ansadas. 4 · Pez. Forma visual y acróstico cristiano, con otros usos posibles según el objeto.</desc>
