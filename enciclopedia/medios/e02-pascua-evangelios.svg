<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 338" role="img" aria-label="El anuncio pascual en los cuatro evangelios">
  <rect x="0" y="0" width="920" height="338" fill="#f4efe2"/>
  <text x="36" y="47" font-family="sans-serif" font-size="25" fill="#282622" font-weight="700">El anuncio pascual en los cuatro evangelios</text>
  <rect x="36" y="76" width="848" height="45" fill="#fffaf0"/><path d="M36 76v45" stroke="#8b601e" stroke-width="4"/><text x="52" y="105" font-family="sans-serif" font-size="17" font-weight="700" fill="#2e2a24">Marcos 16:1–8</text><text x="281" y="105" font-family="sans-serif" font-size="17" fill="#332e29">Visita de las mujeres y anuncio de un encuentro en Galilea</text>
  <rect x="36" y="138" width="848" height="45" fill="#e9dfca"/><path d="M36 138v45" stroke="#8b601e" stroke-width="4"/><text x="52" y="167" font-family="sans-serif" font-size="17" font-weight="700" fill="#2e2a24">Mateo 28</text><text x="281" y="167" font-family="sans-serif" font-size="17" fill="#332e29">Guardias, encuentro y encargo a los discípulos en Galilea</text>
  <rect x="36" y="200" width="848" height="45" fill="#fffaf0"/><path d="M36 200v45" stroke="#8b601e" stroke-width="4"/><text x="52" y="229" font-family="sans-serif" font-size="17" font-weight="700" fill="#2e2a24">Lucas 24</text><text x="281" y="229" font-family="sans-serif" font-size="17" fill="#332e29">Relato de Emaús y encuentros en torno a Jerusalén</text>
  <rect x="36" y="262" width="848" height="45" fill="#e9dfca"/><path d="M36 262v45" stroke="#8b601e" stroke-width="4"/><text x="52" y="291" font-family="sans-serif" font-size="17" font-weight="700" fill="#2e2a24">Juan 20–21</text><text x="281" y="291" font-family="sans-serif" font-size="17" fill="#332e29">María Magdalena, Tomás y escena junto al lago</text>
</svg>
