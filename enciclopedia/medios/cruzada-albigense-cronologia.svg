  <text x="194" y="365" class="date" text-anchor="end">1217–1218</text>
  <circle cx="213" cy="359" r="5" fill="#267568"/>
  <text x="237" y="365" class="item"><tspan x="237" dy="0">Regreso del conde y muerte de Montfort en el sitio</tspan></text>
  <text x="194" y="410" class="date" text-anchor="end">1226</text>
