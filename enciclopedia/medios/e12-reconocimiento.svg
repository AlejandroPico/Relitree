<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 469" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Del culto local al examen romano</title>
<desc id="detalle">Antigüedad. Comunidades conservan tumbas, relatos y aniversarios. Edad Media temprana. Elevaciones y traslaciones dan relieve al culto local. 993. Juan XV reconoce a Ulrico de Augsburgo en un caso documentado. Siglos XII–XIII. Crece la intervención pontificia y se organizan investigaciones locales. Época moderna. Nuevas normas de examen y control del culto público.</desc>
