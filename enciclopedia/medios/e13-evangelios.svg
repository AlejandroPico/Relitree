<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 548" role="img" aria-labelledby="titulo detalle">
<title id="titulo">María en el Nuevo Testamento</title>
<desc id="detalle">Gálatas 4,4. Pablo habla del Hijo nacido de mujer y bajo la ley. Mateo 1–2. José, el nacimiento, los magos y el itinerario de la familia. Lucas 1–2. Anunciación, visita a Isabel, Magníficat y presentación en el templo. Marcos 3 y 6. La madre de Jesús y el debate sobre los parentescos. Juan 2 y 19. La boda de Caná y la relación con el discípulo junto a la cruz. Hechos 1,14. María está entre quienes perseveran en la oración.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
