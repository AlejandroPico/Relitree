<svg xmlns="http://www.w3.org/2000/svg" width="720" height="564" viewBox="0 0 720 564" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">De Constantinopla a Éfeso y Calcedonia, 428–451</title>
  <desc id="descripcion">Seis hitos ordenados cronológicamente y espaciados de forma esquemática. Se destacan las dos asambleas de junio de 431 y la adhesión romana en julio.</desc>
  <rect width="720" height="564" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="51" font-size="31" font-weight="700">La controversia de Éfeso</text>
    <text x="36" y="80" font-size="17" fill="#abc1d5">428–451 · Cronología esquemática</text>
    <path d="M 55,125 V 515" stroke="#6d879f" stroke-width="2"/>
    <g>
      <circle cx="55" cy="125" r="5" fill="#acd6f6"/>
      <text x="80" y="131" font-size="21" font-weight="700" fill="#acd6f6">428</text>
      <text x="204" y="131" font-size="22" font-weight="700">Nestorio en Constantinopla</text>
      <text x="204" y="159" font-size="16" fill="#c0d1e0">La controversia se extiende desde la capital.</text>
    </g>
    <g>
      <circle cx="55" cy="203" r="5" fill="#acd6f6"/>
      <text x="80" y="209" font-size="21" font-weight="700" fill="#acd6f6">430</text>
      <text x="204" y="209" font-size="22" font-weight="700">Sínodos de Roma y Alejandría</text>
      <text x="204" y="237" font-size="16" fill="#c0d1e0">Cirilo envía su tercera carta y los doce anatemas.</text>
    </g>
    <g>
      <circle cx="55" cy="281" r="8" fill="#ffd490"/>
      <text x="80" y="287" font-size="21" font-weight="700" fill="#ffd490">Jun. 431</text>
      <text x="204" y="287" font-size="22" font-weight="700">Dos asambleas en Éfeso</text>
      <text x="204" y="315" font-size="16" fill="#c0d1e0">Los grupos de Cirilo y Juan dictan sentencias enfrentadas.</text>
    </g>
    <g>
      <circle cx="55" cy="359" r="8" fill="#ffd490"/>
      <text x="80" y="365" font-size="21" font-weight="700" fill="#ffd490">Jul. 431</text>
      <text x="204" y="365" font-size="22" font-weight="700">Llegan los legados romanos</text>
      <text x="204" y="393" font-size="16" fill="#c0d1e0">Se adhieren a la deposición de Nestorio.</text>
    </g>
    <g>
      <circle cx="55" cy="437" r="5" fill="#acd6f6"/>
      <text x="80" y="443" font-size="21" font-weight="700" fill="#acd6f6">433</text>
      <text x="204" y="443" font-size="22" font-weight="700">Fórmula de unión</text>
      <text x="204" y="471" font-size="16" fill="#c0d1e0">Alejandría y Antioquía restablecen la comunión.</text>
    </g>
    <g>
      <circle cx="55" cy="515" r="5" fill="#acd6f6"/>
      <text x="80" y="521" font-size="21" font-weight="700" fill="#acd6f6">451</text>
      <text x="204" y="521" font-size="22" font-weight="700">Calcedonia</text>
      <text x="204" y="549" font-size="16" fill="#c0d1e0">La definición recibe las cartas de Cirilo.</text>
    </g>
  </g>
</svg>
