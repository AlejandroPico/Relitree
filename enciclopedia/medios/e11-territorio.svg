<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 312" role="img" aria-labelledby="tit desc">
<title id="tit">Roma, Santa Sede y territorio</title><desc id="desc">Hasta 1870. El papa gobierna los Estados Pontificios y la Iglesia católica. 1870–1929. La cuestión romana sigue abierta mientras continúa la diplomacia de la Santa Sede. Desde 1929. La Ciudad del Vaticano da una base territorial a la independencia de la sede.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#20314a}.title{font-size:26px;font-weight:640}.label{font-weight:650}.sub{fill:#435570}</style>
<rect width="740" height="312" fill="white"/>
<text class="title" x="22" y="37">Roma, Santa Sede y territorio</text>
<text class="sub" x="22" y="66">Tres situaciones jurídicas</text>
<rect x="22" y="98" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="98" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="123">Hasta 1870</text>
<text class="event" x="237" y="123">El papa gobierna los Estados Pontificios y la</text>
<text class="event" x="237" y="146">Iglesia católica.</text>
<rect x="22" y="164" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="164" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="189">1870–1929</text>
<text class="event" x="237" y="189">La cuestión romana sigue abierta mientras continúa</text>
<text class="event" x="237" y="212">la diplomacia de la Santa Sede.</text>
<rect x="22" y="230" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="230" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="255">Desde 1929</text>
<text class="event" x="237" y="255">La Ciudad del Vaticano da una base territorial a</text>
<text class="event" x="237" y="278">la independencia de la sede.</text>
</svg>
