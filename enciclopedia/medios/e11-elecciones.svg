<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 432" role="img" aria-labelledby="tit desc">
<title id="tit">Cómo cambió la elección del papa</title><desc id="desc">1059. Nicolás II da iniciativa electoral a los cardenales obispos. 1179. Letrán III fija la mayoría de dos tercios. 1274. Lyon II regula la reclusión de los electores. 1417. Constanza incluye representantes de las naciones para resolver el cisma. 1996–2013. Constitución electoral contemporánea y modificaciones.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#20314a}.title{font-size:26px;font-weight:640}.label{font-weight:650}.sub{fill:#435570}</style>
<rect width="740" height="432" fill="white"/>
<text class="title" x="22" y="37">Cómo cambió la elección del papa</text>
<text class="sub" x="22" y="66">Cinco referentes de la historia electoral</text>
<rect x="22" y="98" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="98" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="123">1059</text>
<text class="event" x="237" y="123">Nicolás II da iniciativa electoral a los</text>
<text class="event" x="237" y="146">cardenales obispos.</text>
<rect x="22" y="164" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="164" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="189">1179</text>
<text class="event" x="237" y="189">Letrán III fija la mayoría de dos tercios.</text>
<rect x="22" y="224" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="224" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="249">1274</text>
<text class="event" x="237" y="249">Lyon II regula la reclusión de los electores.</text>
<rect x="22" y="284" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="284" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="309">1417</text>
<text class="event" x="237" y="309">Constanza incluye representantes de las naciones</text>
<text class="event" x="237" y="332">para resolver el cisma.</text>
<rect x="22" y="350" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="350" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="375">1996–2013</text>
<text class="event" x="237" y="375">Constitución electoral contemporánea y</text>
<text class="event" x="237" y="398">modificaciones.</text>
</svg>
