  <circle cx="213" cy="162" r="5" fill="#267568"/>
  <text x="237" y="168" class="item"><tspan x="237" dy="0">Fundación de Riga y de los Hermanos de la Espada</tspan></text>
  <text x="194" y="213" class="date" text-anchor="end">1219</text>
