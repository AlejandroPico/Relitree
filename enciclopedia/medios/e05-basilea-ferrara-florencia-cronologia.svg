<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Del concilio de Basilea a dos asambleas</title>
  <desc id="descripcion">1431, Apertura de los trabajos en Basilea. 1436, Proclamación de los acuerdos de Jihlava. 1437, Eugenio IV decreta el traslado a Ferrara. Basilea y Lausana: 1439, Deposición de Eugenio IV; 1439, Elección de Félix V; 1449, Renuncia de Félix V y cierre. Ferrara, Florencia y Roma: 1438, Apertura de Ferrara; 1439, Unión en Florencia; 1443, Continuación en Roma; 1445, Última sesión en Letrán.</desc>
  <rect width="760" height="510" fill="#f3eee3"/>
  <path d="M0 0H760V68H0Z" fill="#23353a"/>
  <text x="28" y="44" fill="#fff8e9" font-family="Georgia,serif" font-size="31">Del concilio de Basilea a dos asambleas</text>
  <path d="M128 104V216H60V251M128 216H420V251" fill="none" stroke="#927044" stroke-width="3"/>
