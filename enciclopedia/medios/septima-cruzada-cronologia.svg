<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 444" role="img" aria-labelledby="title description">
  <title id="title">Séptima cruzada · 1248–1254</title>
  <desc id="description">1244. Pérdida de Jerusalén y derrota de La Forbie. 1248. Embarque e invernada en Chipre. Jun. 1249. Desembarco y toma de Damieta. Feb. 1250. Combates en al-Manṣūra. Abr. 1250. Derrota de Fariskur y captura de Luis IX. May. 1250. Rescate y devolución de Damieta. 1250–1254. Estancia de Luis IX en el Levante. 1254. Regreso a Francia</desc>
  <rect width="760" height="444" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #23302d }
    .title { font-size: 28px; font-weight: 730 }
    .note { font-size: 16px; fill: #435653 }
    .date { font-size: 19px; font-weight: 700; fill: #165d53 }
    .item { font-size: 19px; font-weight: 550 }
    .head { font-size: 22px; font-weight: 680 }
    .place { font-size: 17px; font-weight: 700; paint-order: stroke; stroke: #f7f4ec; stroke-width: 4; stroke-linejoin: round }
    .water { font-size: 17px; fill: #456672; font-style: italic }
  </style>
  <text x="30" y="45" class="title">Séptima cruzada · 1248–1254</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M173 105V406" stroke="#6d9188" stroke-width="3"/>
  <text x="151" y="111" class="date" text-anchor="end">1244</text>
  <circle cx="173" cy="105" r="6" fill="#277268"/>
  <text x="200" y="111" class="item">Pérdida de Jerusalén y derrota de La Forbie</text>
  <text x="151" y="154" class="date" text-anchor="end">1248</text>
  <circle cx="173" cy="148" r="6" fill="#277268"/>
  <text x="200" y="154" class="item">Embarque e invernada en Chipre</text>
  <text x="151" y="197" class="date" text-anchor="end">Jun. 1249</text>
  <circle cx="173" cy="191" r="6" fill="#277268"/>
  <text x="200" y="197" class="item">Desembarco y toma de Damieta</text>
  <text x="151" y="240" class="date" text-anchor="end">Feb. 1250</text>
  <circle cx="173" cy="234" r="6" fill="#277268"/>
  <text x="200" y="240" class="item">Combates en al-Manṣūra</text>
  <text x="151" y="283" class="date" text-anchor="end">Abr. 1250</text>
  <circle cx="173" cy="277" r="6" fill="#277268"/>
  <text x="200" y="283" class="item">Derrota de Fariskur y captura de Luis IX</text>
  <text x="151" y="326" class="date" text-anchor="end">May. 1250</text>
  <circle cx="173" cy="320" r="6" fill="#277268"/>
  <text x="200" y="326" class="item">Rescate y devolución de Damieta</text>
  <text x="151" y="369" class="date" text-anchor="end">1250–1254</text>
  <circle cx="173" cy="363" r="6" fill="#277268"/>
  <text x="200" y="369" class="item">Estancia de Luis IX en el Levante</text>
  <text x="151" y="412" class="date" text-anchor="end">1254</text>
  <circle cx="173" cy="406" r="6" fill="#277268"/>
  <text x="200" y="412" class="item">Regreso a Francia</text>
</svg>
