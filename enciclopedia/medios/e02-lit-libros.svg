<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" role="img" aria-labelledby="title desc">
<title id="title">Qué libro consultar</title><desc id="desc">Calendario. Fecha, conmemoración y rango de la celebración. Leccionario. Pasajes bíblicos y secuencia de lecturas. Misal o eucologio. Orden de la celebración, oraciones y participación de sus ministros. Libro de oficio. Salmos, lecturas y plegarias de la mañana, la tarde y otras horas. Himnario. Repertorio de cantos y respuestas.</desc>
