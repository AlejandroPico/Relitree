<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 630" role="img" aria-labelledby="title desc">
<title id="title">Biblias de la Reforma · Cronología</title>
<desc id="desc">1516. Nuevo Testamento de Erasmo. Edición impresa del griego con una versión latina.. 1522–1526. Lutero y Tyndale. Nuevos Testamentos alemán e inglés.. 1531–1535. Zúrich, Wittenberg, Coverdale y Olivétan. Biblias completas en alemán, inglés y francés.. 1539–1543. Gran Biblia y Nuevo Testamento de Enzinas. Uso parroquial inglés y una edición castellana en Amberes.. 1560–1569. Ginebra y Basilea. Biblia inglesa de Ginebra y Biblia del Oso en castellano.. 1579–1610. Kralice, Gales, Vizsoly, Reims y Douai. Biblias checa, galesa y húngara y edición católica inglesa.. 1602–1611. Valera y rey Jacobo. Revisión castellana y nueva traducción inglesa en equipo.</desc>
