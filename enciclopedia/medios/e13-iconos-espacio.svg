<text class="label" x="39" y="387">1 · Cúpula</text>
<text x="267" y="387">Un Pantocrátor puede dominar el centro de la</text>
<text x="267" y="410">elevación.</text>
<rect x="20" y="434" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="434" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="459">2 · Arcos y bóvedas</text>
<text x="267" y="459">Superficies que pueden acoger escenas de las</text>
<text x="267" y="482">fiestas.</text>
<rect x="20" y="506" width="700" height="56" fill="#f0f5f8"/>
<rect x="20" y="506" width="5" height="56" fill="#47748d"/>
