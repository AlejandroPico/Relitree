<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 476" role="img" aria-labelledby="titulo detalle">
<title id="titulo">De la fraternidad a sus reglas</title>
<desc id="detalle">Hacia 1209–1210. Viaje a Roma y reconocimiento inicial bajo Inocencio III. 1221 · Regla no bulada. Compila orientaciones, normas y pasajes evangélicos. 1223 · Regla bulada. Honorio III confirma una regla de formulación más breve. 1226 · Testamento. Francisco recuerda los comienzos y señala lo que desea conservar. 1230 · Quo elongati. Gregorio IX trata la relación jurídica entre Testamento y regla.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="476" fill="white"/>
<text class="title" x="20" y="39">De la fraternidad a sus reglas</text>
<text class="subtitle" x="20" y="70">Los textos responden a situaciones distintas</text>
<rect x="20" y="100" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">Hacia 1209–1210</text>
<text x="267" y="125">Viaje a Roma y reconocimiento inicial bajo</text>
<text x="267" y="148">Inocencio III.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">1221 · Regla no bulada</text>
<text x="267" y="197">Compila orientaciones, normas y pasajes</text>
<text x="267" y="220">evangélicos.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">1223 · Regla bulada</text>
<text x="267" y="269">Honorio III confirma una regla de formulación</text>
<text x="267" y="292">más breve.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">1226 · Testamento</text>
<text x="267" y="341">Francisco recuerda los comienzos y señala lo</text>
<text x="267" y="364">que desea conservar.</text>
<rect x="20" y="388" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="413">1230 · Quo elongati</text>
<text x="267" y="413">Gregorio IX trata la relación jurídica entre</text>
<text x="267" y="436">Testamento y regla.</text>
</svg>
