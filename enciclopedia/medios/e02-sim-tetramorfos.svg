<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">El tetramorfos de los evangelistas</title><desc id="desc">Mateo. Figura humana o ángel. Marcos. León. Lucas. Toro o buey. Juan. Águila. Fuentes. Ezequiel y Apocalipsis. Hubo otras asociaciones en la interpretación antigua.</desc>
