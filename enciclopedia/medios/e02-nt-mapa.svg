<svg xmlns="http://www.w3.org/2000/svg" width="760" height="706" viewBox="0 0 760 706" role="img" aria-labelledby="title desc">
<title id="title">Ciudades del Nuevo Testamento</title><desc id="desc">Galilea y Jerusalén. Escenarios principales de los Evangelios y del comienzo de Hechos. Antioquía y Éfeso. Centros de conexión con comunidades del Mediterráneo oriental. Corinto, Filipos y Tesalónica. Ciudades que aparecen en itinerarios y cartas. Roma y Patmos. Roma cierra Hechos. Juan sitúa en Patmos el inicio de su visión. Lugares representados: Roma, Tesalónica, Filipos, Corinto, Éfeso, Patmos, Antioquía, Galilea, Jerusalén.</desc>
