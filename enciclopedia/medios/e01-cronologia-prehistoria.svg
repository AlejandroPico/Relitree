<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 463" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Cronología de algunos hallazgos</title><desc id="descripcion">Compara cuatro hallazgos paleolíticos con fechas aproximadas o mínimas y dos intervalos neolíticos. Los ejes utilizan unidades distintas.</desc>
<style>
  text {font-family: system-ui, Segoe UI, sans-serif; fill: #1b3029}
  .titulo {font-size: 31px; font-weight: 700}
  .subtitulo {font-size: 18px; fill: #334d43}
  .etiqueta {font-size: 22px; font-weight: 650}
  .nota {font-size: 18px; fill: #334d43; paint-order: stroke; stroke: #f6f5ef; stroke-width: 4px; stroke-linejoin: round}
</style>
