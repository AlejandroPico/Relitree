<svg xmlns="http://www.w3.org/2000/svg" width="760" height="419" viewBox="0 0 760 419" role="img" aria-labelledby="title desc">
<title id="title">Las fuentes sobre Pablo</title>
<desc id="desc">Cartas atribuidas a Pablo. Comunicación directa con comunidades. Fechas, destinos y circunstancias parcialmente reconstruibles. Hechos. Relato amplio y posterior de itinerarios, discursos y procesos. Inscripciones. Puntos externos de referencia, como el nombre y el cargo de Galión. Tradiciones sobre Roma. Historia de la recepción, el recuerdo de la muerte y el culto.</desc>
