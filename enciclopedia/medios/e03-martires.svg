<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc">
<title id="title">Cómo se documenta un martirio</title>
<desc id="desc">Acta. Preguntas, respuestas y sentencia tal como se transmitieron. Carta. Recuerdo de una comunidad que corresponde a su situación y a sus lectores. Pasión. Relato con voces, escenas y recursos literarios. Puede incluir un testimonio antiguo. Inscripción o calendario. Lugar y fecha de memoria. La atribución histórica requiere otras pruebas.</desc>
<style>text{font:16px system-ui,sans-serif;fill:#19364a}.label{font-weight:660}.title{font-size:26px;font-weight:700}.subtitle{fill:#466577}</style>
<rect width="760" height="396" fill="white"/>
<text x="22" y="39" class="title">Cómo se documenta un martirio</text><text x="23" y="67" class="subtitle">Cuatro tipos de testimonio y sus límites</text>
<rect x="21" y="94" width="718" height="66" fill="#e9f3f6"/>
<rect x="21" y="94" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="120">Acta</text>
<text x="280" y="120">Preguntas, respuestas y sentencia tal como se</text>
<text x="280" y="143">transmitieron.</text>
<rect x="21" y="166" width="718" height="66" fill="#f2f5fb"/>
<rect x="21" y="166" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="192">Carta</text>
<text x="280" y="192">Recuerdo de una comunidad que corresponde a su</text>
<text x="280" y="215">situación y a sus lectores.</text>
<rect x="21" y="238" width="718" height="66" fill="#e9f3f6"/>
<rect x="21" y="238" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="264">Pasión</text>
<text x="280" y="264">Relato con voces, escenas y recursos literarios.</text>
<text x="280" y="287">Puede incluir un testimonio antiguo.</text>
<rect x="21" y="310" width="718" height="66" fill="#f2f5fb"/>
<rect x="21" y="310" width="4" height="66" fill="#46748a"/>
<text class="label" x="37" y="336">Inscripción o calendario</text>
<text x="280" y="336">Lugar y fecha de memoria. La atribución histórica</text>
<text x="280" y="359">requiere otras pruebas.</text>
</svg>
