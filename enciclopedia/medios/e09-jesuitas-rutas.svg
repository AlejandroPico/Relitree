<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">De Goa a las misiones asiáticas</title><desc id="descripcion">De Goa a las misiones asiáticas. Itinerarios jesuitas de los siglos XVI y XVII. Goa · 1542. Base de aprovisionamiento, formación y correspondencia. Kagoshima · 1549. Javier llega con Anjirō. Se abren contactos con señores japoneses. Zhaoqing · 1583. Ruggieri y Ricci obtienen residencia con apoyo desde Macao. Pekín · 1601. Ricci se establece en la capital imperial de los Ming. Madurai · desde 1606. De Nobili adapta sus formas de trato al entorno letrado local.</desc>
<rect width="720" height="528" fill="#f7faf9"/>
<g font-family="system-ui, sans-serif">
