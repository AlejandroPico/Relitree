<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 782" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Monasterios del monte Athos</title>
<desc id="detalle">Entrada y centro. Dafní es un puerto de acceso. Karyés reúne órganos de la comunidad. Costa oriental. Vatopedi e Iviron dan referencias a lo largo de esta vertiente. Costa occidental. Simonos Petra aprovecha un emplazamiento elevado sobre el mar. Extremo meridional. La cumbre y la Gran Laura ocupan sectores distintos en la parte más montañosa.</desc>
