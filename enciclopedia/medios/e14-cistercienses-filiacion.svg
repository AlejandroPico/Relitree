<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Filiación y coordinación entre abadías</title>
<desc id="descripcion">Casa local. El abad y la comunidad organizan su vida ordinaria. Casa madre. La filiación prevé responsabilidad de visita y corrección. Capítulo general. Los abades tratan asuntos comunes y transmiten estatutos.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#1e3030}.titulo{font-size:28px;font-weight:700}.etiqueta{font-size:21px;font-weight:700}.detalle{font-size:18px}</style>
