<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 517" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Recorrido de la fase 9</title>
<desc id="descripcion">Recorrido de la fase 9. 9.1 · Europa y América. Conversión, conquista, parroquias y misiones. 9.2–9.3 · Ritos, dominio y libertad. Traducciones, derechos indígenas, esclavitud y abolición. 9.4–9.5 · Asia, África y misiones. Iglesias locales, órdenes religiosas, imperios y redes protestantes. 9.6 · El cristianismo actual. África contemporánea y el peso del sur global.</desc>
<rect width="720" height="517" fill="#fbf8ef"/>
