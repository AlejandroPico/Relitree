<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">381 y 451</text>
<text x="267" y="125">Constantinopla I y Calcedonia fijan precedencia</text>
<text x="267" y="148">y atribuciones.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">1204–1261</text>
<text x="267" y="197">Conquista latina, sede ortodoxa en Nicea y</text>
<text x="267" y="220">regreso a Constantinopla.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">1453–1454</text>
<text x="267" y="269">Conquista otomana y patriarcado de Genadio II</text>
<text x="267" y="292">Escolario.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">Siglo XIX</text>
<text x="267" y="341">Reformas otomanas, reglamentos y reorganización</text>
<text x="267" y="364">eclesiástica.</text>
<rect x="20" y="388" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="413">1920–1923</text>
<text x="267" y="413">Carta ecuménica y Convenio de Lausana sobre</text>
<text x="267" y="436">intercambio de poblaciones.</text>
<rect x="20" y="460" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="460" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="485">1964–1965</text>
<text x="267" y="485">Encuentro de Atenágoras y Pablo VI y</text>
<text x="267" y="508">declaración conjunta.</text>
<rect x="20" y="532" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="532" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="557">2016–2019</text>
<text x="267" y="557">Concilio de Creta y tomos de autocefalia para</text>
<text x="267" y="580">la Iglesia ortodoxa de Ucrania.</text>
