<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Qué muestra cada indicio</title>
<desc id="descripcion">Qué muestra cada indicio. Proclamación pública. Una inscripción como Jelling expresa la posición de un soberano. Culto e instrucción. Libros, tumbas y templos documentan prácticas y formas de transmitirlas. Institucionalización. Donaciones, visitas y pleitos muestran cómo se estableció el gobierno de una iglesia.</desc>
<rect width="720" height="456" fill="#fbf8ef"/>
<g font-family="system-ui, sans-serif">
<text x="34" y="52" font-size="31" font-weight="700" fill="#243238" text-anchor="start">Qué muestra cada indicio</text>
<text x="35" y="87" font-size="22" font-weight="400" fill="#46575d" text-anchor="start">Conversión y prácticas a lo largo del tiempo</text>
<path d="M36 120v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="137" r="8" fill="#385b6b"/>
<text x="61" y="145" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Proclamación pública</text>
<text x="61" y="173" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Una inscripción como Jelling expresa la posición de</text>
<text x="61" y="197" font-size="22" font-weight="400" fill="#243238" text-anchor="start">un soberano.</text>
<path d="M36 229v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="246" r="8" fill="#385b6b"/>
<text x="61" y="254" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Culto e instrucción</text>
<text x="61" y="282" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Libros, tumbas y templos documentan prácticas y</text>
<text x="61" y="306" font-size="22" font-weight="400" fill="#243238" text-anchor="start">formas de transmitirlas.</text>
<path d="M36 338v96" stroke="#385b6b" stroke-width="4"/>
<circle cx="36" cy="355" r="8" fill="#385b6b"/>
<text x="61" y="363" font-size="25" font-weight="700" fill="#385b6b" text-anchor="start">Institucionalización</text>
<text x="61" y="391" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Donaciones, visitas y pleitos muestran cómo se</text>
<text x="61" y="415" font-size="22" font-weight="400" fill="#243238" text-anchor="start">estableció el gobierno de una iglesia.</text>
</g>
</svg>
