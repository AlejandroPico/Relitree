<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" role="img" aria-labelledby="tit des">
<title id="tit">Elección, ordenación e investidura</title><desc id="des">Elección. Designa un titular. Los grupos podían impugnar el procedimiento. Consagración. Confía el oficio episcopal por medio de obispos. Regalías. El acceso a derechos y recursos temporales implicaba al soberano. Worms, 1122. Distingue anillo y báculo de la entrega de regalías mediante cetro.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="390" fill="#ffffff"/>
<text x="26" y="37" class="title">Elección, ordenación e investidura</text>
<text x="26" y="68" class="sub">Actos que podían coincidir en una misma disputa</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">Elección</text><text x="246" y="129" class="event">Designa un titular. Los grupos podían impugnar el</text><text x="246" y="152" class="event">procedimiento.</text><rect x="26" y="172" width="688" height="58" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="58" fill="#365987" /><text x="44" y="199" class="label">Consagración</text><text x="246" y="199" class="event">Confía el oficio episcopal por medio de obispos.</text><rect x="26" y="235" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="235" width="4" height="65" fill="#365987" /><text x="44" y="262" class="label">Regalías</text><text x="246" y="262" class="event">El acceso a derechos y recursos temporales</text><text x="246" y="285" class="event">implicaba al soberano.</text><rect x="26" y="305" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="305" width="4" height="65" fill="#365987" /><text x="44" y="332" class="label">Worms, 1122</text><text x="246" y="332" class="event">Distingue anillo y báculo de la entrega de regalías</text><text x="246" y="355" class="event">mediante cetro.</text>
</svg>
