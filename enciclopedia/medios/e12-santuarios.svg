<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 329" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Tres itinerarios de peregrinación</title>
<desc id="detalle">Cuthbert · Durham. Relatos de traslado de los restos y evangelio conservado con el cuerpo. Santiago · Compostela. Liturgia, milagros e itinerarios agrupados en el Liber Sancti Jacobi. Becket · Canterbury. Culto extendido por peregrinación, insignias y relicarios.</desc>
