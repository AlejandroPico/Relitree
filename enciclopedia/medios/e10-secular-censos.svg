<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Afiliación declarada en Inglaterra y Gales</title>
  <desc id="descripcion">Censos de Inglaterra y Gales. Se declararon cristianos el 59,3 % del total de residentes en 2011 y el 46,2 % en 2021. Sin religión declaró estar el 25,2 % en 2011 y el 37,2 % en 2021.</desc>
  <rect width="720" height="324" fill="#faf8f1"/>
  <g font-family="system-ui, sans-serif" fill="#202d36">
    <text x="30" y="45" font-size="26" font-weight="700">Afiliación declarada en Inglaterra y Gales</text>
    <text x="30" y="73" font-size="16" fill="#4b5b61">Dos categorías · porcentaje del total de residentes</text>
    <text x="30" y="120" font-size="16" font-weight="650">Cristianos · 2011</text>
    <rect x="250" y="101" width="331" height="26" fill="#e7eae1"/>
    <rect x="250" y="101" width="327" height="26" fill="#376764"/>
    <text x="600" y="120" font-size="17" font-weight="700">59,3 %</text>
    <text x="30" y="170" font-size="16" font-weight="650">Cristianos · 2021</text>
    <rect x="250" y="151" width="331" height="26" fill="#e7eae1"/>
    <rect x="250" y="151" width="255" height="26" fill="#936139"/>
    <text x="600" y="170" font-size="17" font-weight="700">46,2 %</text>
    <text x="30" y="220" font-size="16" font-weight="650">Sin religión · 2011</text>
    <rect x="250" y="201" width="331" height="26" fill="#e7eae1"/>
    <rect x="250" y="201" width="139" height="26" fill="#376764"/>
    <text x="600" y="220" font-size="17" font-weight="700">25,2 %</text>
    <text x="30" y="270" font-size="16" font-weight="650">Sin religión · 2021</text>
    <rect x="250" y="251" width="331" height="26" fill="#e7eae1"/>
    <rect x="250" y="251" width="205" height="26" fill="#936139"/>
    <text x="600" y="270" font-size="17" font-weight="700">37,2 %</text>
  </g>
</svg>
