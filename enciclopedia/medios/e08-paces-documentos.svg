<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Los tres tratados de 1648</title>
<desc id="descripcion">En enero, España y las Provincias Unidas pactan en Münster. En octubre, el Imperio pacta con Francia en Münster y con Suecia en Osnabrück</desc>
<rect width="720" height="475" fill="#faf7ef"/>
<g font-family="system-ui, sans-serif">
<text x="36" y="52" font-size="31" font-weight="700" fill="#17262a" text-anchor="start">Los tres tratados de 1648</text>
<text x="36" y="88" font-size="22" font-weight="400" fill="#43555a" text-anchor="start">Dos ciudades y acuerdos distintos</text>
<rect x="35" y="117" width="4" height="100" fill="#3a6553"/>
<circle cx="37" cy="137" r="8" fill="#3a6553"/>
<text x="63" y="144" font-size="25" font-weight="700" fill="#3a6553" text-anchor="start">30 de enero · Münster</text>
<text x="63" y="178" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">Monarquía Hispánica y Provincias Unidas. Juramento</text>
<text x="63" y="204" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">público en mayo.</text>
<rect x="35" y="232" width="4" height="100" fill="#3a6553"/>
<circle cx="37" cy="252" r="8" fill="#3a6553"/>
<text x="63" y="259" font-size="25" font-weight="700" fill="#3a6553" text-anchor="start">24 de octubre · Münster</text>
<text x="63" y="293" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">Emperador e Imperio con Francia. Instrumento de Paz</text>
<text x="63" y="319" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">de Münster.</text>
<rect x="35" y="347" width="4" height="100" fill="#3a6553"/>
<circle cx="37" cy="367" r="8" fill="#3a6553"/>
<text x="63" y="374" font-size="25" font-weight="700" fill="#3a6553" text-anchor="start">24 de octubre · Osnabrück</text>
<text x="63" y="408" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">Emperador e Imperio con Suecia. Instrumento de Paz de</text>
<text x="63" y="434" font-size="23" font-weight="400" fill="#17262a" text-anchor="start">Osnabrück.</text>
</g>
</svg>
