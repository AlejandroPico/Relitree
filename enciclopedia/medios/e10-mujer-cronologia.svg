<svg xmlns="http://www.w3.org/2000/svg" width="720" height="469" viewBox="0 0 720 469" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cambios en el acceso a ministerios</title>
  <desc id="descripcion">Cambios en el acceso a ministerios. Fechas y jurisdicciones seleccionadas. 1944. Florence Li Tim-Oi es ordenada en la diócesis anglicana de Hong Kong.. 1956. La Iglesia Metodista de Estados Unidos concede plenos derechos clericales.. 1974 · 1976. Ordenaciones de Filadelfia y reforma en la Iglesia Episcopal.. 1994 · 2014. Presbiterado femenino y medida sobre obispas en la Iglesia de Inglaterra.. 2021. La Iglesia latina abre a mujeres los ministerios instituidos de lector y acólito..</desc>
  <rect width="720" height="469" fill="#faf8f1"/>
  <g font-family="system-ui, sans-serif" fill="#202d36">
    <text x="30" y="45" font-size="26" font-weight="700">Cambios en el acceso a ministerios</text>
    <text x="30" y="73" font-size="16" fill="#4b5b61">Fechas y jurisdicciones seleccionadas</text>
    <rect x="30" y="94" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="94" width="3" height="64" fill="#376764"/>
    <text x="44" y="123" font-size="16" font-weight="700" fill="#254d4b">1944</text>
    <text x="228" y="120" font-size="16">Florence Li Tim-Oi es ordenada en la diócesis</text>
    <text x="228" y="142" font-size="16">anglicana de Hong Kong.</text>
    <rect x="30" y="166" width="660" height="64" fill="#f4eee3"/>
    <rect x="30" y="166" width="3" height="64" fill="#376764"/>
    <text x="44" y="195" font-size="16" font-weight="700" fill="#254d4b">1956</text>
    <text x="228" y="192" font-size="16">La Iglesia Metodista de Estados Unidos concede plenos</text>
    <text x="228" y="214" font-size="16">derechos clericales.</text>
    <rect x="30" y="238" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="238" width="3" height="64" fill="#376764"/>
    <text x="44" y="267" font-size="16" font-weight="700" fill="#254d4b">1974 · 1976</text>
    <text x="228" y="264" font-size="16">Ordenaciones de Filadelfia y reforma en la Iglesia</text>
    <text x="228" y="286" font-size="16">Episcopal.</text>
    <rect x="30" y="310" width="660" height="64" fill="#f4eee3"/>
    <rect x="30" y="310" width="3" height="64" fill="#376764"/>
    <text x="44" y="339" font-size="16" font-weight="700" fill="#254d4b">1994 · 2014</text>
    <text x="228" y="336" font-size="16">Presbiterado femenino y medida sobre obispas en la</text>
    <text x="228" y="358" font-size="16">Iglesia de Inglaterra.</text>
    <rect x="30" y="382" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="382" width="3" height="64" fill="#376764"/>
    <text x="44" y="411" font-size="16" font-weight="700" fill="#254d4b">2021</text>
    <text x="228" y="408" font-size="16">La Iglesia latina abre a mujeres los ministerios</text>
    <text x="228" y="430" font-size="16">instituidos de lector y acólito.</text>
  </g>
</svg>
