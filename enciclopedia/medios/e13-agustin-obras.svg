<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 465" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Cinco modos de leer a Agustín</title>
<desc id="detalle">Confesiones. La vida narrada desemboca en memoria, tiempo y Escritura. Cartas 93 y 185. El bautismo y la coacción en la controversia africana. La ciudad de Dios. Roma, la historia y los fines de la convivencia. La Trinidad. Escritura y analogías de memoria, inteligencia y voluntad. Retractaciones. El autor revisa y ordena lo que había escrito.</desc>
