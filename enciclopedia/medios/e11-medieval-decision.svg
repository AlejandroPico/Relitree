<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" role="img" aria-labelledby="tit des">
<title id="tit">Tres cambios en la elección pontificia</title><desc id="des">1059. Los cardenales obispos adquieren iniciativa en la elección. 1179. Letrán III establece mayoría de dos tercios de los cardenales. 1274. Lyon II regula la reclusión después de la larga vacante de Viterbo. 1276. La aplicación de las reglas de Lyon se suspende.</desc>
