<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 537" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Juan Wesley y el metodismo temprano</title>
<desc id="detalle">1703–1735. Nacimiento en Epworth, formación en Oxford y ministerio anglicano. 1736–1738. Estancia en Georgia y regreso a Inglaterra. Reunión de Aldersgate en mayo de 1738. 1739–1744. Predicación al aire libre, New Room de Bristol y primera conferencia metodista. 1774. Publicación de Thoughts upon Slavery. 1784. Envío del Sunday Service y Conferencia de Navidad en Baltimore. 1791. Muerte en Londres. Las sociedades siguen trayectorias propias.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
