<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 432" role="img" aria-labelledby="tit desc">
<title id="tit">Del Cisma de Occidente a Basilea</title><desc id="desc">1378. Urbano VI y Clemente VII encabezan obediencias rivales. 1409. Pisa abre una tercera sucesión. 1417. Constanza elige a Martín V. Pedro de Luna mantiene su reclamación. 1429. Clemente VIII renuncia a la principal continuación de Peñíscola. 1439–1449. Basilea elige a Félix V, que termina renunciando.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#20314a}.title{font-size:26px;font-weight:640}.label{font-weight:650}.sub{fill:#435570}</style>
<rect width="740" height="432" fill="white"/>
<text class="title" x="22" y="37">Del Cisma de Occidente a Basilea</text>
<text class="sub" x="22" y="66">La elección común y las reclamaciones posteriores</text>
<rect x="22" y="98" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="98" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="123">1378</text>
<text class="event" x="237" y="123">Urbano VI y Clemente VII encabezan obediencias</text>
<text class="event" x="237" y="146">rivales.</text>
<rect x="22" y="164" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="164" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="189">1409</text>
<text class="event" x="237" y="189">Pisa abre una tercera sucesión.</text>
<rect x="22" y="224" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="224" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="249">1417</text>
<text class="event" x="237" y="249">Constanza elige a Martín V. Pedro de Luna mantiene</text>
<text class="event" x="237" y="272">su reclamación.</text>
<rect x="22" y="290" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="290" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="315">1429</text>
<text class="event" x="237" y="315">Clemente VIII renuncia a la principal continuación</text>
<text class="event" x="237" y="338">de Peñíscola.</text>
<rect x="22" y="356" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="356" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="381">1439–1449</text>
<text class="event" x="237" y="381">Basilea elige a Félix V, que termina renunciando.</text>
</svg>
