  <circle cx="147" cy="157" r="6" fill="#267868"/>
  <text x="170" y="164" class="item">Primeras ediciones del Malleus maleficarum</text>
  <text x="126" y="209" class="date" text-anchor="end">1563</text>
  <circle cx="147" cy="202" r="6" fill="#267868"/>
  <text x="170" y="209" class="item">Ley escocesa sobre brujería</text>
  <text x="126" y="254" class="date" text-anchor="end">1590</text>
