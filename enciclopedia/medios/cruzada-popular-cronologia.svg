<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 401" role="img" aria-labelledby="title description">
  <title id="title">Las expediciones de 1096 y 1101</title>
  <desc id="description">Primav. 1096. Partida de grupos anteriores a los contingentes señoriales. Primav. 1096. Ataques contra comunidades judías en Renania. Oct. 1096. Derrota de los grupos de Civetot en Anatolia. Jul. 1099. Las fuerzas de la Primera cruzada toman Jerusalén. 1100. Captura de Bohemundo en Anatolia. Verano 1101. Derrotas cerca de Merzifon y Heraclea. 1102. Supervivientes intervienen en el reino de Jerusalén</desc>
  <rect width="760" height="401" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill:#23302d }
    .title { font-size:28px; font-weight:730 }
    .note { font-size:16px; fill:#435653 }
    .date { font-size:19px; font-weight:700; fill:#165d53 }
    .item { font-size:19px; font-weight:550 }
    .head { font-size:22px; font-weight:680 }
    .place { font-size:17px; font-weight:700; paint-order:stroke; stroke:#f7f4ec; stroke-width:4; stroke-linejoin:round }
    .water { font-size:17px; fill:#456672; font-style:italic }
  </style>
  <text x="30" y="45" class="title">Las expediciones de 1096 y 1101</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M173 105V363" stroke="#6d9188" stroke-width="3"/>
  <text x="151" y="111" class="date" text-anchor="end">Primav. 1096</text>
  <circle cx="173" cy="105" r="6" fill="#277268"/>
  <text x="200" y="111" class="item">Partida de grupos anteriores a los contingentes señoriales</text>
  <text x="151" y="154" class="date" text-anchor="end">Primav. 1096</text>
  <circle cx="173" cy="148" r="6" fill="#277268"/>
  <text x="200" y="154" class="item">Ataques contra comunidades judías en Renania</text>
  <text x="151" y="197" class="date" text-anchor="end">Oct. 1096</text>
  <circle cx="173" cy="191" r="6" fill="#277268"/>
  <text x="200" y="197" class="item">Derrota de los grupos de Civetot en Anatolia</text>
  <text x="151" y="240" class="date" text-anchor="end">Jul. 1099</text>
  <circle cx="173" cy="234" r="6" fill="#277268"/>
