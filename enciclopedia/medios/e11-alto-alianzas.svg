<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 327" role="img" aria-labelledby="tit des">
<title id="tit">Quién podía proteger Roma</title><desc id="des">Siglo VII. Autoridades imperiales, exarca y mandos locales intervienen en Italia. Mediados del VIII. La sede busca a Pipino frente a la presión lombarda. Siglo IX. Los carolingios intervienen en Roma. Sus crisis abren nuevas alianzas italianas.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="327" fill="#ffffff"/>
<text x="26" y="37" class="title">Quién podía proteger Roma</text>
<text x="26" y="68" class="sub">Tres marcos de negociación con fechas de referencia</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">Siglo VII</text><text x="246" y="129" class="event">Autoridades imperiales, exarca y mandos locales</text><text x="246" y="152" class="event">intervienen en Italia.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">Mediados del VIII</text><text x="246" y="199" class="event">La sede busca a Pipino frente a la presión</text><text x="246" y="222" class="event">lombarda.</text><rect x="26" y="242" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="65" fill="#365987" /><text x="44" y="269" class="label">Siglo IX</text><text x="246" y="269" class="event">Los carolingios intervienen en Roma. Sus crisis</text><text x="246" y="292" class="event">abren nuevas alianzas italianas.</text>
