<title id="title">Reforma radical · Corrientes y debates</title>
<desc id="desc">Hermanos Suizos. Bautismo y congregación. Schleitheim incluye disposiciones sobre espada y juramento.. Moravia. Refugio y bienes compartidos. Las comunidades huteritas desarrollan un régimen de bienes comunes.. Países Bajos. Predicación y no resistencia. Menno Simons reorganiza congregaciones tras Münster.. Espiritualistas. Experiencia interior. Franck y Schwenckfeld discuten el alcance de los ritos.. Antitrinitarios. Debates sobre la Trinidad. Servet y los Hermanos Polacos actúan en contextos distintos.</desc>
