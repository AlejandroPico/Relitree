<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">La controversia de los Tres Capítulos, 544–554</title>
  <desc id="descripcion">Cronología esquemática de ocho hitos que distingue los edictos de Justiniano, la sentencia conciliar y los cambios de posición de Vigilio.</desc>
  <rect width="760" height="730" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="51" font-size="30" font-weight="700">La controversia de los Tres Capítulos</text>
    <text x="36" y="80" font-size="17" fill="#abc1d5">544–554 · Cronología esquemática</text>
    <path d="M55 125 V671" stroke="#6d879f" stroke-width="2"/>
    <g>
      <circle cx="55" cy="125" r="5" fill="#acd6f6"/>
      <text x="79" y="131" font-size="20" font-weight="700" fill="#acd6f6">544–545</text>
      <text x="224" y="131" font-size="22" font-weight="700">Primer edicto de Justiniano</text>
      <text x="224" y="159" font-size="16" fill="#c0d1e0">La corte condena los Tres Capítulos.</text>
    </g>
    <g>
      <circle cx="55" cy="203" r="5" fill="#acd6f6"/>
      <text x="79" y="209" font-size="20" font-weight="700" fill="#acd6f6">548</text>
      <text x="224" y="209" font-size="22" font-weight="700">Iudicatum de Vigilio</text>
      <text x="224" y="237" font-size="16" fill="#c0d1e0">El papa condena los Capítulos y reafirma Calcedonia.</text>
    </g>
    <g>
      <circle cx="55" cy="281" r="5" fill="#acd6f6"/>
      <text x="79" y="287" font-size="20" font-weight="700" fill="#acd6f6">551</text>
      <text x="224" y="287" font-size="22" font-weight="700">Segundo edicto imperial</text>
      <text x="224" y="315" font-size="16" fill="#c0d1e0">Vigilio protesta tras el acuerdo de esperar al concilio.</text>
    </g>
    <g>
      <circle cx="55" cy="359" r="5" fill="#acd6f6"/>
      <text x="79" y="365" font-size="20" font-weight="700" fill="#acd6f6">5 may. 553</text>
      <text x="224" y="365" font-size="22" font-weight="700">Apertura del concilio</text>
      <text x="224" y="393" font-size="16" fill="#c0d1e0">Eutiquio preside. Vigilio permanece al margen.</text>
    </g>
    <g>
      <circle cx="55" cy="437" r="5" fill="#acd6f6"/>
      <text x="79" y="443" font-size="20" font-weight="700" fill="#acd6f6">14 may. 553</text>
      <text x="224" y="443" font-size="22" font-weight="700">Primer Constitutum</text>
      <text x="224" y="471" font-size="16" fill="#c0d1e0">Vigilio rechaza proposiciones de Teodoro y limita la censura.</text>
    </g>
    <g>
      <circle cx="55" cy="515" r="8" fill="#ffd490"/>
      <text x="79" y="521" font-size="20" font-weight="700" fill="#ffd490">2 jun. 553</text>
      <text x="224" y="521" font-size="22" font-weight="700">Sentencia de los obispos</text>
      <text x="224" y="549" font-size="16" fill="#c0d1e0">El concilio condena los Capítulos y publica catorce anatemas.</text>
    </g>
    <g>
      <circle cx="55" cy="593" r="5" fill="#acd6f6"/>
      <text x="79" y="599" font-size="20" font-weight="700" fill="#acd6f6">Dic. 553</text>
      <text x="224" y="599" font-size="22" font-weight="700">Vigilio acepta la condena</text>
      <text x="224" y="627" font-size="16" fill="#c0d1e0">El papa comunica a Eutiquio su cambio de posición.</text>
    </g>
    <g>
      <circle cx="55" cy="671" r="5" fill="#acd6f6"/>
      <text x="79" y="677" font-size="20" font-weight="700" fill="#acd6f6">Feb. 554</text>
      <text x="224" y="677" font-size="22" font-weight="700">Segundo Constitutum</text>
      <text x="224" y="705" font-size="16" fill="#c0d1e0">Vigilio explica cómo concilia la condena con Calcedonia.</text>
    </g>
  </g>
</svg>
