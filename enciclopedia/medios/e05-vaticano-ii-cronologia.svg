<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Concilio Vaticano II</title>
  <desc id="descripcion">Una secuencia de nueve fechas que relaciona la convocatoria y los cuatro períodos con la promulgación de los documentos.</desc>
  <rect width="760" height="536" fill="#f5f2eb"/>
  <g font-family="system-ui, sans-serif">
    <text x="31" y="45" font-size="26" font-weight="700" fill="#183236">Concilio Vaticano II</text>
    <text x="31" y="74" font-size="16" fill="#465860">Convocatoria, cuatro períodos de sesiones y clausura</text>
    <path d="M175 117V501" stroke="#5b7679" stroke-width="2"/>
    <circle cx="175" cy="117" r="6" fill="#205c62"/>
    <text x="153" y="122" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">25 ene 1959</text>
    <text x="196" y="122" font-size="17" fill="#183236">Juan XXIII anuncia la convocatoria de un concilio</text>
    <circle cx="175" cy="165" r="6" fill="#205c62"/>
    <text x="153" y="170" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">25 dic 1961</text>
    <text x="196" y="170" font-size="17" fill="#183236">Convocatoria formal por Humanae salutis</text>
    <circle cx="175" cy="213" r="6" fill="#205c62"/>
    <text x="153" y="218" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">11 oct 1962</text>
    <text x="196" y="218" font-size="17" fill="#183236">Apertura del primer período bajo Juan XXIII</text>
    <circle cx="175" cy="261" r="6" fill="#8e472b"/>
    <text x="153" y="266" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">4 dic 1963</text>
    <text x="196" y="266" font-size="17" fill="#183236">Segundo período: liturgia y comunicación social</text>
    <circle cx="175" cy="309" r="6" fill="#8e472b"/>
    <text x="153" y="314" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">21 nov 1964</text>
    <text x="196" y="314" font-size="17" fill="#183236">Tercer período: Iglesia, ecumenismo e iglesias orientales</text>
    <circle cx="175" cy="357" r="6" fill="#8e472b"/>
    <text x="153" y="362" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">28 oct 1965</text>
    <text x="196" y="362" font-size="17" fill="#183236">Cuarto período: Nostra aetate y otros cuatro documentos</text>
    <circle cx="175" cy="405" r="6" fill="#8e472b"/>
    <text x="153" y="410" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">18 nov 1965</text>
    <text x="196" y="410" font-size="17" fill="#183236">Revelación y apostolado de los laicos</text>
    <circle cx="175" cy="453" r="6" fill="#8e472b"/>
    <text x="153" y="458" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">7 dic 1965</text>
    <text x="196" y="458" font-size="17" fill="#183236">Promulgación de los cuatro últimos documentos</text>
    <circle cx="175" cy="501" r="6" fill="#4c4c7d"/>
    <text x="153" y="506" font-size="16" text-anchor="end" font-weight="650" fill="#203a3e">8 dic 1965</text>
    <text x="196" y="506" font-size="17" fill="#183236">Pablo VI clausura el concilio</text>
  </g>
</svg>
