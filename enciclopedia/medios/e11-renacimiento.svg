<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 498" role="img" aria-labelledby="tit desc">
<title id="tit">De Constanza a la Reforma católica</title><desc id="desc">1417–1420. Elección de Martín V y regreso a Roma. 1439–1449. Unión de Florencia, elección y renuncia de Félix V. 1453. Cae Constantinopla. Nicolás V busca una respuesta. 1471–1484. Sixto IV impulsa el puente y la capilla que lleva su nombre. 1506–1527. Comienza la nueva basílica. El saqueo altera la vida de Roma. 1545–1563. Se reúne el Concilio de Trento, con interrupciones.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#20314a}.title{font-size:26px;font-weight:640}.label{font-weight:650}.sub{fill:#435570}</style>
