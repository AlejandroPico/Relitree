<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 727" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Las imágenes dentro de una iglesia</title>
<desc id="detalle">1 · Cúpula. Un Pantocrátor puede dominar el centro de la elevación. 2 · Arcos y bóvedas. Superficies que pueden acoger escenas de las fiestas. 3 · Ábside. La Madre de Dios puede presidir el santuario. 4 · Umbral del santuario. Cerramiento con puertas e imágenes. Su forma y altura varían. 5 · Nártex. Espacio de entrada con un programa propio cuando se conserva.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
