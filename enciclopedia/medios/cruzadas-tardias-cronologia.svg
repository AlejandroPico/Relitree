  <text x="237" y="438" class="item"><tspan x="237" dy="0">El proyecto de Pío II se interrumpe en Ancona</tspan></text>
  <text x="194" y="483" class="date" text-anchor="end">1480–1522</text>
  <circle cx="213" cy="477" r="5" fill="#267568"/>
  <text x="237" y="483" class="item"><tspan x="237" dy="0">Rodas resiste un sitio y capitula en el siguiente</tspan></text>
  <text x="194" y="528" class="date" text-anchor="end">1571</text>
  <circle cx="213" cy="522" r="5" fill="#267568"/>
  <text x="237" y="528" class="item"><tspan x="237" dy="0">Victoria de la Liga Santa en Lepanto</tspan></text>
