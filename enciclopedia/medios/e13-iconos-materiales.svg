<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 476" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Técnicas y soportes bizantinos</title>
<desc id="detalle">Encáustica. Pigmento con cera. El Pantocrátor del Sinaí es un ejemplo. Temple sobre tabla. Pigmento unido con un aglutinante acuoso, como el huevo, sobre una preparación. Mosaico. Teselas de piedra, vidrio u otros materiales. Puede ser mural o portátil. Pintura mural. Color aplicado sobre capas de mortero con procedimientos que pueden combinarse. Marfil y manuscrito. La talla del tríptico o la pintura sobre pergamino permiten la observación próxima.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="476" fill="white"/>
<text class="title" x="20" y="39">Técnicas y soportes bizantinos</text>
<text class="subtitle" x="20" y="70">Cinco ejemplos de cómo se construye una superficie figurada</text>
<rect x="20" y="100" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">Encáustica</text>
<text x="267" y="125">Pigmento con cera. El Pantocrátor del Sinaí es</text>
<text x="267" y="148">un ejemplo.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">Temple sobre tabla</text>
<text x="267" y="197">Pigmento unido con un aglutinante acuoso, como</text>
<text x="267" y="220">el huevo, sobre una preparación.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">Mosaico</text>
<text x="267" y="269">Teselas de piedra, vidrio u otros materiales.</text>
<text x="267" y="292">Puede ser mural o portátil.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">Pintura mural</text>
<text x="267" y="341">Color aplicado sobre capas de mortero con</text>
<text x="267" y="364">procedimientos que pueden combinarse.</text>
<rect x="20" y="388" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="413">Marfil y manuscrito</text>
<text x="267" y="413">La talla del tríptico o la pintura sobre</text>
<text x="267" y="436">pergamino permiten la observación próxima.</text>
</svg>
