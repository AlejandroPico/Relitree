<svg xmlns="http://www.w3.org/2000/svg" width="720" height="469" viewBox="0 0 720 469" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Tareas, cargos y formas de autoridad</title>
  <desc id="descripcion">Tareas, cargos y formas de autoridad. Qué preguntar en cada comunidad y periodo. Predicación. ¿En qué espacios se podía enseñar, hablar o difundir escritos?. Comunidad religiosa. ¿Quién organizaba el trabajo, la formación y el patrimonio?. Servicio. ¿Qué responsabilidades se ejercían en escuelas, hospitales o misiones?. Ministerio instituido. ¿Cómo se confería y qué tareas autorizaba?. Ordenación. ¿Qué órgano decidía el acceso y en qué territorio surtía efecto?.</desc>
  <rect width="720" height="469" fill="#faf8f1"/>
  <g font-family="system-ui, sans-serif" fill="#202d36">
    <text x="30" y="45" font-size="26" font-weight="700">Tareas, cargos y formas de autoridad</text>
    <text x="30" y="73" font-size="16" fill="#4b5b61">Qué preguntar en cada comunidad y periodo</text>
    <rect x="30" y="94" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="94" width="3" height="64" fill="#376764"/>
    <text x="44" y="123" font-size="16" font-weight="700" fill="#254d4b">Predicación</text>
    <text x="228" y="120" font-size="16">¿En qué espacios se podía enseñar, hablar o difundir</text>
    <text x="228" y="142" font-size="16">escritos?</text>
    <rect x="30" y="166" width="660" height="64" fill="#f4eee3"/>
    <rect x="30" y="166" width="3" height="64" fill="#376764"/>
    <text x="44" y="195" font-size="16" font-weight="700" fill="#254d4b">Comunidad religiosa</text>
    <text x="228" y="192" font-size="16">¿Quién organizaba el trabajo, la formación y el</text>
    <text x="228" y="214" font-size="16">patrimonio?</text>
    <rect x="30" y="238" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="238" width="3" height="64" fill="#376764"/>
    <text x="44" y="267" font-size="16" font-weight="700" fill="#254d4b">Servicio</text>
    <text x="228" y="264" font-size="16">¿Qué responsabilidades se ejercían en escuelas,</text>
    <text x="228" y="286" font-size="16">hospitales o misiones?</text>
    <rect x="30" y="310" width="660" height="64" fill="#f4eee3"/>
    <rect x="30" y="310" width="3" height="64" fill="#376764"/>
    <text x="44" y="339" font-size="16" font-weight="700" fill="#254d4b">Ministerio instituido</text>
    <text x="228" y="336" font-size="16">¿Cómo se confería y qué tareas autorizaba?</text>
    <rect x="30" y="382" width="660" height="64" fill="#e8eeea"/>
    <rect x="30" y="382" width="3" height="64" fill="#376764"/>
    <text x="44" y="411" font-size="16" font-weight="700" fill="#254d4b">Ordenación</text>
    <text x="228" y="408" font-size="16">¿Qué órgano decidía el acceso y en qué territorio</text>
    <text x="228" y="430" font-size="16">surtía efecto?</text>
  </g>
</svg>
