<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 444" role="img" aria-labelledby="title description">
  <title id="title">Tercera cruzada · 1189–1192</title>
  <desc id="description">Jul. 1187. Derrota del reino latino en Hattin. Oct. 1187. Jerusalén capitula ante Saladino. 1189. Comienza el asedio de Acre. Jun. 1190. Muere Federico Barbarroja en Cilicia. May. 1191. Ricardo toma Chipre. Jul.–ago. 1191. Cae Acre; matanza de cautivos. Sept. 1191. Combate de Arsuf y avance a Jaffa. Sept. 1192. Tregua de Jaffa o Ramla</desc>
  <rect width="760" height="444" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #23302d }
    .title { font-size: 28px; font-weight: 730 }
    .note { font-size: 16px; fill: #435653 }
    .date { font-size: 19px; font-weight: 700; fill: #165d53 }
    .item { font-size: 19px; font-weight: 550 }
    .head { font-size: 22px; font-weight: 680 }
    .place { font-size: 17px; font-weight: 700; paint-order: stroke; stroke: #f7f4ec; stroke-width: 4; stroke-linejoin: round }
    .water { font-size: 17px; fill: #456672; font-style: italic }
  </style>
  <text x="30" y="45" class="title">Tercera cruzada · 1189–1192</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M173 105V406" stroke="#6d9188" stroke-width="3"/>
  <text x="151" y="111" class="date" text-anchor="end">Jul. 1187</text>
  <circle cx="173" cy="105" r="6" fill="#277268"/>
  <text x="200" y="111" class="item">Derrota del reino latino en Hattin</text>
  <text x="151" y="154" class="date" text-anchor="end">Oct. 1187</text>
  <circle cx="173" cy="148" r="6" fill="#277268"/>
  <text x="200" y="154" class="item">Jerusalén capitula ante Saladino</text>
  <text x="151" y="197" class="date" text-anchor="end">1189</text>
  <circle cx="173" cy="191" r="6" fill="#277268"/>
  <text x="200" y="197" class="item">Comienza el asedio de Acre</text>
  <text x="151" y="240" class="date" text-anchor="end">Jun. 1190</text>
  <circle cx="173" cy="234" r="6" fill="#277268"/>
  <text x="200" y="240" class="item">Muere Federico Barbarroja en Cilicia</text>
  <text x="151" y="283" class="date" text-anchor="end">May. 1191</text>
  <circle cx="173" cy="277" r="6" fill="#277268"/>
  <text x="200" y="283" class="item">Ricardo toma Chipre</text>
  <text x="151" y="326" class="date" text-anchor="end">Jul.–ago. 1191</text>
  <circle cx="173" cy="320" r="6" fill="#277268"/>
  <text x="200" y="326" class="item">Cae Acre; matanza de cautivos</text>
  <text x="151" y="369" class="date" text-anchor="end">Sept. 1191</text>
  <circle cx="173" cy="363" r="6" fill="#277268"/>
  <text x="200" y="369" class="item">Combate de Arsuf y avance a Jaffa</text>
  <text x="151" y="412" class="date" text-anchor="end">Sept. 1192</text>
  <circle cx="173" cy="406" r="6" fill="#277268"/>
  <text x="200" y="412" class="item">Tregua de Jaffa o Ramla</text>
</svg>
