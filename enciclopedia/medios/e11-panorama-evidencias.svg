<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 397" role="img" aria-labelledby="tit des">
<title id="tit">Cómo se documenta la sucesión</title><desc id="des">Fecha y cargo. Listas y calendarios fijan una secuencia, con variantes al comienzo. Actos y conflictos. Cartas, cánones y registros identifican decisiones e interlocutores. Espacios de culto. Inscripciones, edificios y mosaicos localizan personas y prácticas. Memoria posterior. Retratos, leyendas y biografías tardías muestran la recepción.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="397" fill="#ffffff"/>
<text x="26" y="37" class="title">Cómo se documenta la sucesión</text>
<text x="26" y="68" class="sub">Fuentes con funciones distintas</text>
<rect x="26" y="102" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="102" width="4" height="65" fill="#365987" /><text x="44" y="129" class="label">Fecha y cargo</text><text x="246" y="129" class="event">Listas y calendarios fijan una secuencia, con</text><text x="246" y="152" class="event">variantes al comienzo.</text><rect x="26" y="172" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="172" width="4" height="65" fill="#365987" /><text x="44" y="199" class="label">Actos y conflictos</text><text x="246" y="199" class="event">Cartas, cánones y registros identifican decisiones</text><text x="246" y="222" class="event">e interlocutores.</text><rect x="26" y="242" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="242" width="4" height="65" fill="#365987" /><text x="44" y="269" class="label">Espacios de culto</text><text x="246" y="269" class="event">Inscripciones, edificios y mosaicos localizan</text><text x="246" y="292" class="event">personas y prácticas.</text><rect x="26" y="312" width="688" height="65" rx="3" fill="#f4f6f8" /><rect x="26" y="312" width="4" height="65" fill="#365987" /><text x="44" y="339" class="label">Memoria posterior</text><text x="246" y="339" class="event">Retratos, leyendas y biografías tardías muestran la</text><text x="246" y="362" class="event">recepción.</text>
