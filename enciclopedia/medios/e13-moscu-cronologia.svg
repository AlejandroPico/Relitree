<text x="267" y="125">Cristianización vinculada a Kiev y elección de</text>
<text x="267" y="148">Jonás en Moscú.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
