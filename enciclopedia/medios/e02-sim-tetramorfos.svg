<text x="289" y="180">León.</text>
<rect x="24" y="214" width="712" height="54" fill="#eef5f7"/>
<rect x="24" y="214" width="4" height="54" fill="#2f7186"/>
<text class="label" x="40" y="240">Lucas</text>
<text x="289" y="240">Toro o buey.</text>
