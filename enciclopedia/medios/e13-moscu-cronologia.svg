<text x="267" y="197">Reconocimiento de Job y confirmación del lugar</text>
<text x="267" y="220">de la sede.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">1666–1667</text>
<text x="267" y="269">Deposición de Nikon y confirmación de la</text>
<text x="267" y="292">reforma litúrgica.</text>
<rect x="20" y="316" width="700" height="56" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="56" fill="#47748d"/>
<text class="label" x="39" y="341">1721–1917</text>
<text x="267" y="341">Periodo sinodal con supervisión imperial.</text>
<rect x="20" y="377" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="377" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="402">1917–1918</text>
<text x="267" y="402">Concilio y restauración del patriarcado con</text>
<text x="267" y="425">Tijón.</text>
<rect x="20" y="449" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="449" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="474">1943</text>
<text x="267" y="474">Elección de Sergio tras el cambio de política</text>
<text x="267" y="497">soviética en la guerra.</text>
<rect x="20" y="521" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="521" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="546">1970 y 2007</text>
<text x="267" y="546">Tomos de la Iglesia ortodoxa en América y acta</text>
<text x="267" y="569">con la Iglesia rusa fuera de Rusia.</text>
<rect x="20" y="593" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="593" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="618">2018–2019</text>
<text x="267" y="618">Disputa entre las sedes de Moscú y</text>
<text x="267" y="641">Constantinopla en torno a Ucrania.</text>
