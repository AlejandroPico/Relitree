<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 465" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Qué expresa cada vínculo</title>
<desc id="detalle">Precedencia. Lugar de una sede en un orden de honor. Jurisdicción. Responsabilidad eclesiástica ejercida en una sede o territorio. Comisión de diálogo. Formula convergencias y cuestiones pendientes en un ámbito de trabajo común. Declaración conjunta. Expresa lo acordado por los firmantes en un asunto y una fecha concretos. Tomos. Formaliza un acto como la concesión o reconocimiento de una autocefalia.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
