<svg xmlns="http://www.w3.org/2000/svg" width="760" height="706" viewBox="0 0 760 706" role="img" aria-labelledby="title desc">
<title id="title">El mundo del Antiguo Testamento</title><desc id="desc">Egipto y Sinaí. Lugares del relato de la salida. La ubicación de su itinerario sigue abierta. Samaría y Jerusalén. Capitales de los reinos del norte y del sur en buena parte de la etapa monárquica. Nínive y Babilonia. El poder asirio y el babilónico intervienen en momentos diferentes. Susa y el mundo persa. La corte de Ester da otro contexto que el regreso a Judá bajo el poder persa. Lugares representados: Delta del Nilo, Sinaí, Jerusalén, Samaría, Nínive, Babilonia, Susa.</desc>
