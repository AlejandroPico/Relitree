<text class="title" x="22" y="37">De Constanza a la Reforma católica</text>
<text class="sub" x="22" y="66">Cronología selectiva</text>
<rect x="22" y="98" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="98" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="123">1417–1420</text>
<text class="event" x="237" y="123">Elección de Martín V y regreso a Roma.</text>
<rect x="22" y="158" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="158" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="183">1439–1449</text>
<text class="event" x="237" y="183">Unión de Florencia, elección y renuncia de Félix</text>
<text class="event" x="237" y="206">V.</text>
<rect x="22" y="224" width="696" height="56" fill="#f1f5f8"/>
<rect x="22" y="224" width="4" height="56" fill="#59718e"/>
<text class="label" x="41" y="249">1453</text>
<text class="event" x="237" y="249">Cae Constantinopla. Nicolás V busca una respuesta.</text>
<rect x="22" y="284" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="284" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="309">1471–1484</text>
<text class="event" x="237" y="309">Sixto IV impulsa el puente y la capilla que lleva</text>
<text class="event" x="237" y="332">su nombre.</text>
<rect x="22" y="350" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="350" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="375">1506–1527</text>
<text class="event" x="237" y="375">Comienza la nueva basílica. El saqueo altera la</text>
<text class="event" x="237" y="398">vida de Roma.</text>
<rect x="22" y="416" width="696" height="62" fill="#f1f5f8"/>
<rect x="22" y="416" width="4" height="62" fill="#59718e"/>
<text class="label" x="41" y="441">1545–1563</text>
<text class="event" x="237" y="441">Se reúne el Concilio de Trento, con</text>
<text class="event" x="237" y="464">interrupciones.</text>
