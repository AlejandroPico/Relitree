<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 401" role="img" aria-labelledby="title description">
  <title id="title">Octava cruzada · 1270</title>
  <desc id="description">1267. Luis IX toma de nuevo la cruz. 1270. Embarque en el sur de Francia. Jul. 1270. Desembarco en el entorno de Cartago. 25 ago. 1270. Muere Luis IX en el campamento. Ago. 1270. Llegan las fuerzas de Carlos de Anjou. Oct. 1270. Tratado y acuerdo de retirada. 1271–1272. Eduardo de Inglaterra actúa desde Acre</desc>
