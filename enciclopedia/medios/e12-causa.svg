<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 461" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Cómo se investiga una causa</title>
<desc id="detalle">Investigación local. La diócesis reúne testimonios, escritos y documentación. Examen en Roma. Se evalúan virtudes, martirio u ofrecimiento de la vida. Signos atribuidos. Los milagros se estudian según la vía y la etapa. Beatificación. Se autoriza un culto público de alcance determinado. Canonización. Se inscribe al santo para el culto de la Iglesia universal.</desc>
