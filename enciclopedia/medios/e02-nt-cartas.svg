<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">El recorrido de una carta</title><desc id="desc">Composición. Remitente, colaboradores y situación que motiva la carta. Viaje. La persona enviada lleva el texto y puede explicar encargos o novedades. Recepción. La comunidad escucha y decide cómo responder, aplicar o compartir el escrito. Transmisión. Se guarda, se copia y se reúne con otras cartas en colecciones.</desc>
<style>text{font-family:system-ui,sans-serif;font-size:16px;fill:#16374a}.name{font-size:29px;font-weight:700}.label{font-weight:650}.sub{fill:#486473}.fine{font-size:12px}.place{font-size:13px;font-weight:650;paint-order:stroke;stroke:#eff8fb;stroke-width:3px;stroke-linejoin:round}</style>
<rect width="760" height="384" fill="#fff"/>
<text x="24" y="38" class="name">El recorrido de una carta</text><text x="25" y="67" class="sub">El texto escrito forma parte de una relación entre personas</text>
<rect x="24" y="94" width="712" height="62" fill="#eef5f7"/>
<rect x="24" y="94" width="4" height="62" fill="#2f7186"/>
<text class="label" x="40" y="120">Composición</text>
<text x="289" y="120">Remitente, colaboradores y situación que motiva la</text>
<text x="289" y="144">carta.</text>
<rect x="24" y="162" width="712" height="62" fill="#f4f6fc"/>
<rect x="24" y="162" width="4" height="62" fill="#2f7186"/>
<text class="label" x="40" y="188">Viaje</text>
<text x="289" y="188">La persona enviada lleva el texto y puede explicar</text>
<text x="289" y="212">encargos o novedades.</text>
<rect x="24" y="230" width="712" height="62" fill="#eef5f7"/>
<rect x="24" y="230" width="4" height="62" fill="#2f7186"/>
<text class="label" x="40" y="256">Recepción</text>
<text x="289" y="256">La comunidad escucha y decide cómo responder,</text>
<text x="289" y="280">aplicar o compartir el escrito.</text>
<rect x="24" y="298" width="712" height="62" fill="#f4f6fc"/>
<rect x="24" y="298" width="4" height="62" fill="#2f7186"/>
<text class="label" x="40" y="324">Transmisión</text>
<text x="289" y="324">Se guarda, se copia y se reúne con otras cartas en</text>
<text x="289" y="348">colecciones.</text>
</svg>
