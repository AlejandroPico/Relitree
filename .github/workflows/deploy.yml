name: Validar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Continuidad del árbol y de la enciclopedia
        env:
          BASE_PUBLICACION: ${{ github.event.before }}
        run: |
          base="$BASE_PUBLICACION"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          cd backend
          python -m relitree.integridad "$base"
      - name: Dependencias de Python
        run: pip install -r backend/requirements.txt
      - name: Dependencias de Node
        run: npm ci --no-audit --no-fund
      - name: Pruebas de datos y trazado
        run: npm test
      - name: Base de datos SQLite y compilación de Angular
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/relitree/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
