<svg xmlns="http://www.w3.org/2000/svg" width="690" viewBox="0 0 690 517" role="img" aria-labelledby="title description">
  <title id="title">La caza de brujas</title>
  <desc id="description">1428. Comienzan persecuciones en el Valais. Déc. 1480. Primeras ediciones del Malleus maleficarum. 1563. Ley escocesa sobre brujería. 1590. Procesos de North Berwick. 1609–1614. Labort, Logroño e instrucciones de la Suprema. Déc. 1620. Grandes series en Würzburg y Bamberg. 1631. Publicación de Cautio Criminalis, de Friedrich Spee. 1692–1693. Juicios y revisión de causas en Massachusetts. 1735–1736. Cambio de la legislación británica</desc>
  <rect width="690" height="517" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #202a2a }
    .title { font-size: 28px; font-weight: 720 }
    .note { font-size: 17px; fill: #465553 }
    .date { font-size: 20px; fill: #175d54; font-weight: 700 }
    .item { font-size: 19px; font-weight: 560 }
    .head { font-size: 22px; font-weight: 690 }
  </style>
  <text x="34" y="48" class="title">La caza de brujas</text>
  <text x="34" y="77" class="note">Intervalos sin escala proporcional</text>
  <path d="M147 112V472" stroke="#678c83" stroke-width="3"/>
