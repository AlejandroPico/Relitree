<text x="32" y="54" class="t">Mani, siglo III</text>
<text x="32" y="86" class="d">Referencias de la biografía y su recepción posterior.</text>
<rect x="32" y="115" width="716" height="67" fill="#e5eee5"/><text x="49" y="142" class="h">Hacia 216</text><text x="49" y="168" class="d">Nacimiento situado en el ámbito mesopotámico.</text>
<rect x="32" y="194" width="716" height="67" fill="#e5eee5"/><text x="49" y="221" class="h">Juventud</text><text x="49" y="247" class="d">Formación entre bautistas en la biografía maniquea.</text>
<rect x="32" y="273" width="716" height="67" fill="#e5eee5"/><text x="49" y="300" class="h">Reinado de Sapor I</text><text x="49" y="326" class="d">Difusión de su enseñanza y composición del Šābuhragān.</text>
<rect x="32" y="352" width="716" height="67" fill="#e5eee5"/><text x="49" y="379" class="h">Década de 270</text><text x="49" y="405" class="d">Cautiverio y muerte durante el reinado de Bahrām I.</text>
