<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 566" role="img" aria-labelledby="title description">
  <title id="title">Cruzadas tardías · Cronología</title>
  <desc id="description">1291. Toma mameluca de Acre. 1344. La liga ocupa el puerto de Esmirna. 1365. Toma, saqueo y retirada de Alejandría. 1390–1396. Campaña de Mahdía y derrota de Nicópolis. 1420–1431. Expediciones contra los husitas. 1444. Derrota de la coalición en Varna. 1453–1456. Caída de Constantinopla y defensa de Belgrado. 1464. El proyecto de Pío II se interrumpe en Ancona. 1480–1522. Rodas resiste un sitio y capitula en el siguiente. 1571. Victoria de la Liga Santa en Lepanto</desc>
  <rect width="760" height="566" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #243532 }
    .title { font-size: 27px; font-weight: 720 }
    .note { font-size: 15px; fill: #435653 }
    .date { font-size: 17px; font-weight: 700; fill: #165d53 }
    .item { font-size: 18px; font-weight: 520 }
    .place { font-size: 16px; font-weight: 650; paint-order: stroke; stroke: #f7f4ec; stroke-width: 3px; stroke-linejoin: round }
    .water { font-size: 17px; font-weight: 570; fill: #466875; font-style: italic }
  </style>
  <text x="28" y="45" class="title">Cruzadas tardías · Cronología</text>
  <text x="28" y="73" class="note">Hitos seleccionados · intervalos sin escala proporcional</text>
