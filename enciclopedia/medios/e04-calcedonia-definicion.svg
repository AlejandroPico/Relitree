<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Una persona en dos naturalezas</title>
  <desc id="descripcion">Las propiedades divinas y humanas pertenecen al mismo Hijo. Sin confusión y sin cambio preservan la distinción de las naturalezas. Sin división y sin separación preservan la unidad personal.</desc>
  <rect width="720" height="432" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="52" font-size="31" font-weight="700">La definición de Calcedonia</text>
    <rect x="36" y="80" width="648" height="274" rx="10" fill="#172a3a" stroke="#6d879f" stroke-width="2"/>
    <text x="360" y="120" text-anchor="middle" fill="#ffd490" font-size="25" font-weight="700">Un solo Hijo, Jesucristo</text>
    <text x="360" y="150" text-anchor="middle" font-size="19">Una persona en dos naturalezas</text>
    <path d="M 36,179 H 684 M 360,179 V 286 M 36,286 H 684" fill="none" stroke="#6d879f" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="198" y="222" font-size="22" font-weight="700" fill="#acd6f6">Según la divinidad</text>
      <text x="198" y="255" font-size="18">Consustancial al Padre</text>
      <text x="522" y="222" font-size="22" font-weight="700" fill="#acd6f6">Según la humanidad</text>
      <text x="522" y="255" font-size="18">Consustancial a nosotros</text>
      <text x="360" y="328" font-size="19">Distinción de propiedades · Sin confusión ni cambio</text>
      <text x="360" y="396" font-size="19" fill="#ffd490">Unidad personal · Sin división ni separación</text>
    </g>
  </g>
</svg>
