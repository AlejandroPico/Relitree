<svg xmlns="http://www.w3.org/2000/svg" width="760" height="726" viewBox="0 0 760 726" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">La controversia sobre la voluntad de Cristo</title>
  <desc id="descripcion">Ocho hitos desde el pacto de Alejandría hasta la restauración del reconocimiento del concilio tras la caída de Filípico.</desc>
  <rect width="760" height="726" fill="#111c28"/>
  <g font-family="system-ui, sans-serif" fill="#eaf0f7">
    <text x="36" y="51" font-size="30" font-weight="700">La controversia sobre la voluntad de Cristo</text>
    <text x="36" y="81" font-size="17" fill="#abc1d5">633–713 · Cronología esquemática</text>
    <path d="M 55 125 V 657" stroke="#6d879f" stroke-width="2"/>
    <g>
      <circle cx="55" cy="125" r="5" fill="#acd6f6"/>
      <text x="79" y="131" font-size="20" font-weight="700" fill="#acd6f6">633</text>
      <text x="212" y="131" font-size="22" font-weight="700">Pacto de Alejandría</text>
      <text x="212" y="159" font-size="16" fill="#c0d1e0">Ciro promueve una fórmula de una sola operación.</text>
    </g>
    <g>
      <circle cx="55" cy="201" r="5" fill="#acd6f6"/>
      <text x="79" y="207" font-size="20" font-weight="700" fill="#acd6f6">638</text>
      <text x="212" y="207" font-size="22" font-weight="700">Éctesis de Heraclio</text>
      <text x="212" y="235" font-size="16" fill="#c0d1e0">La corte prescribe la confesión de una sola voluntad.</text>
    </g>
    <g>
      <circle cx="55" cy="277" r="5" fill="#acd6f6"/>
      <text x="79" y="283" font-size="20" font-weight="700" fill="#acd6f6">648</text>
      <text x="212" y="283" font-size="22" font-weight="700">Tipo de Constante II</text>
      <text x="212" y="311" font-size="16" fill="#c0d1e0">El edicto ordena cesar la discusión de ambos asuntos.</text>
    </g>
    <g>
      <circle cx="55" cy="353" r="5" fill="#acd6f6"/>
      <text x="79" y="359" font-size="20" font-weight="700" fill="#acd6f6">649</text>
      <text x="212" y="359" font-size="22" font-weight="700">Sínodo de Letrán</text>
      <text x="212" y="387" font-size="16" fill="#c0d1e0">Martín I y los obispos rechazan los dos edictos.</text>
    </g>
    <g>
      <circle cx="55" cy="429" r="5" fill="#acd6f6"/>
      <text x="79" y="435" font-size="20" font-weight="700" fill="#acd6f6">662</text>
      <text x="212" y="435" font-size="22" font-weight="700">Muerte de Máximo el Confesor</text>
      <text x="212" y="463" font-size="16" fill="#c0d1e0">El monje muere tras su condena y exilio.</text>
    </g>
    <g>
      <circle cx="55" cy="505" r="8" fill="#ffd490"/>
      <text x="79" y="511" font-size="20" font-weight="700" fill="#ffd490">Nov. 680</text>
      <text x="212" y="511" font-size="22" font-weight="700">Apertura en Constantinopla</text>
      <text x="212" y="539" font-size="16" fill="#c0d1e0">El concilio comienza bajo Constantino IV.</text>
    </g>
    <g>
      <circle cx="55" cy="581" r="8" fill="#ffd490"/>
      <text x="79" y="587" font-size="20" font-weight="700" fill="#ffd490">Sep. 681</text>
      <text x="212" y="587" font-size="22" font-weight="700">Definición conciliar</text>
      <text x="212" y="615" font-size="16" fill="#c0d1e0">Se confiesan dos voluntades y dos operaciones naturales.</text>
    </g>
    <g>
      <circle cx="55" cy="657" r="5" fill="#acd6f6"/>
      <text x="79" y="663" font-size="20" font-weight="700" fill="#acd6f6">711–713</text>
      <text x="212" y="663" font-size="22" font-weight="700">Reinado de Filípico</text>
      <text x="212" y="691" font-size="16" fill="#c0d1e0">La impugnación temporal termina tras su caída.</text>
    </g>
  </g>
</svg>
