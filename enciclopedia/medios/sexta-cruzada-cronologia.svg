<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 444" role="img" aria-labelledby="title description">
  <title id="title">Sexta cruzada · 1228–1229</title>
  <desc id="description">1225. Compromiso de San Germano. 1225. Matrimonio de Federico e Isabel de Jerusalén. 1227. Partida interrumpida y excomunión. 1228. Viaje por Chipre y llegada a Acre. Feb. 1229. Acuerdo de Jaffa con al-Kāmil. Mar. 1229. Federico entra en Jerusalén. 1229. Salida del Levante. 1230. Reconciliación con Gregorio IX</desc>
  <rect width="760" height="444" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #23302d }
    .title { font-size: 28px; font-weight: 730 }
    .note { font-size: 16px; fill: #435653 }
    .date { font-size: 19px; font-weight: 700; fill: #165d53 }
    .item { font-size: 19px; font-weight: 550 }
    .head { font-size: 22px; font-weight: 680 }
    .place { font-size: 17px; font-weight: 700; paint-order: stroke; stroke: #f7f4ec; stroke-width: 4; stroke-linejoin: round }
    .water { font-size: 17px; fill: #456672; font-style: italic }
  </style>
  <text x="30" y="45" class="title">Sexta cruzada · 1228–1229</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M173 105V406" stroke="#6d9188" stroke-width="3"/>
  <text x="151" y="111" class="date" text-anchor="end">1225</text>
  <circle cx="173" cy="105" r="6" fill="#277268"/>
  <text x="200" y="111" class="item">Compromiso de San Germano</text>
  <text x="151" y="154" class="date" text-anchor="end">1225</text>
  <circle cx="173" cy="148" r="6" fill="#277268"/>
  <text x="200" y="154" class="item">Matrimonio de Federico e Isabel de Jerusalén</text>
  <text x="151" y="197" class="date" text-anchor="end">1227</text>
  <circle cx="173" cy="191" r="6" fill="#277268"/>
  <text x="200" y="197" class="item">Partida interrumpida y excomunión</text>
  <text x="151" y="240" class="date" text-anchor="end">1228</text>
  <circle cx="173" cy="234" r="6" fill="#277268"/>
  <text x="200" y="240" class="item">Viaje por Chipre y llegada a Acre</text>
  <text x="151" y="283" class="date" text-anchor="end">Feb. 1229</text>
  <circle cx="173" cy="277" r="6" fill="#277268"/>
  <text x="200" y="283" class="item">Acuerdo de Jaffa con al-Kāmil</text>
  <text x="151" y="326" class="date" text-anchor="end">Mar. 1229</text>
  <circle cx="173" cy="320" r="6" fill="#277268"/>
  <text x="200" y="326" class="item">Federico entra en Jerusalén</text>
  <text x="151" y="369" class="date" text-anchor="end">1229</text>
  <circle cx="173" cy="363" r="6" fill="#277268"/>
  <text x="200" y="369" class="item">Salida del Levante</text>
  <text x="151" y="412" class="date" text-anchor="end">1230</text>
  <circle cx="173" cy="406" r="6" fill="#277268"/>
  <text x="200" y="412" class="item">Reconciliación con Gregorio IX</text>
