<text x="50" y="162" font-size="19" font-weight="400" fill="#253c43" text-anchor="start">Residencia, adjudicación del suelo y reconocimiento escolar.</text>
<rect x="34" y="188" width="652" height="63" rx="3" fill="#e7efed"/>
<rect x="34" y="188" width="5" height="63" fill="#3b756d"/>
