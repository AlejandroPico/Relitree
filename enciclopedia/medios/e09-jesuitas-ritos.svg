<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 429" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Quién decidía sobre los ritos chinos</title><desc id="descripcion">Quién decidía sobre los ritos chinos. Actores y competencias en el debate. Familias y letrados. Interpretación y participación en ceremonias de respeto. Misioneros. Consulta sobre ofrendas, tablillas, vocabulario y gestos. Corte Qing. Control de residencia y autoridad sobre usos públicos. Santa Sede. Reglas eclesiásticas para la actuación de ministros y fieles.</desc>
