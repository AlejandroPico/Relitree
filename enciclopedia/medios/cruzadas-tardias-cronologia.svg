  <text x="194" y="168" class="date" text-anchor="end">1344</text>
  <circle cx="213" cy="162" r="5" fill="#267568"/>
  <text x="237" y="168" class="item"><tspan x="237" dy="0">La liga ocupa el puerto de Esmirna</tspan></text>
  <text x="194" y="213" class="date" text-anchor="end">1365</text>
  <circle cx="213" cy="207" r="5" fill="#267568"/>
  <text x="237" y="213" class="item"><tspan x="237" dy="0">Toma, saqueo y retirada de Alejandría</tspan></text>
  <text x="194" y="258" class="date" text-anchor="end">1390–1396</text>
  <circle cx="213" cy="252" r="5" fill="#267568"/>
  <text x="237" y="258" class="item"><tspan x="237" dy="0">Campaña de Mahdía y derrota de Nicópolis</tspan></text>
  <text x="194" y="303" class="date" text-anchor="end">1420–1431</text>
  <circle cx="213" cy="297" r="5" fill="#267568"/>
  <text x="237" y="303" class="item"><tspan x="237" dy="0">Expediciones contra los husitas</tspan></text>
  <text x="194" y="348" class="date" text-anchor="end">1444</text>
  <circle cx="213" cy="342" r="5" fill="#267568"/>
  <text x="237" y="348" class="item"><tspan x="237" dy="0">Derrota de la coalición en Varna</tspan></text>
  <text x="194" y="393" class="date" text-anchor="end">1453–1456</text>
  <circle cx="213" cy="387" r="5" fill="#267568"/>
  <text x="237" y="393" class="item"><tspan x="237" dy="0">Caída de Constantinopla y defensa de Belgrado</tspan></text>
  <text x="194" y="438" class="date" text-anchor="end">1464</text>
