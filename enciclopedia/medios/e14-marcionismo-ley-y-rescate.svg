<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Creación, ley y rescate</title>
<desc id="descripcion">Creador. Relacionado con el mundo, la ley y el ejercicio de la justicia. Dios revelado por Cristo. Presentado como bueno y ajeno al origen del mundo. Rescate. La lectura marcionita atribuye la iniciativa a la bondad del Dios que envía a Cristo.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#1e3030}.titulo{font-size:28px;font-weight:700}.etiqueta{font-size:21px;font-weight:700}.detalle{font-size:18px}</style>
<rect width="840" height="432" fill="#f5f4ec"/>
<text x="34" y="40" class="titulo">Creación, ley y rescate</text>
<rect x="34" y="70" width="772" height="100" fill="#e4ebe3"/>
<rect x="34" y="70" width="5" height="100" fill="#36605a"/>
<text x="55" y="99" class="etiqueta">Creador</text>
<text x="55" y="128" class="detalle">Relacionado con el mundo, la ley y el ejercicio de la justicia.</text>
<rect x="34" y="182" width="772" height="100" fill="#e4ebe3"/>
<rect x="34" y="182" width="5" height="100" fill="#36605a"/>
<text x="55" y="211" class="etiqueta">Dios revelado por Cristo</text>
<text x="55" y="240" class="detalle">Presentado como bueno y ajeno al origen del mundo.</text>
<rect x="34" y="294" width="772" height="100" fill="#e4ebe3"/>
<rect x="34" y="294" width="5" height="100" fill="#36605a"/>
<text x="55" y="323" class="etiqueta">Rescate</text>
<text x="55" y="352" class="detalle">La lectura marcionita atribuye la iniciativa a la bondad del Dios</text>
<text x="55" y="374" class="detalle">que envía a Cristo.</text>
</svg>
