<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 465" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Cómo leer un artículo de la Suma</title>
<desc id="detalle">Pregunta. Se formula el problema de forma que admita discusión. Objeciones. Se exponen razones que la respuesta tendrá que considerar. Sed contra. Aparece una razón o autoridad en sentido contrario. Respondeo. Tomás formula y desarrolla su propia resolución. Réplicas. Cada objeción recibe una respuesta particular.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#193144}.title{font-size:27px;font-weight:650}.label{font-weight:650}.subtitle{fill:#4b6576}.grid-note{font-size:12px;fill:#415c6f}.map-label{font-size:15px;paint-order:stroke;stroke:#eef6f8;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="740" height="465" fill="white"/>
<text class="title" x="20" y="39">Cómo leer un artículo de la Suma</text>
<text class="subtitle" x="20" y="70">Una conclusión se entiende siguiendo el orden del argumento</text>
<rect x="20" y="100" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="100" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="125">Pregunta</text>
<text x="267" y="125">Se formula el problema de forma que admita</text>
<text x="267" y="148">discusión.</text>
<rect x="20" y="172" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="172" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="197">Objeciones</text>
<text x="267" y="197">Se exponen razones que la respuesta tendrá que</text>
<text x="267" y="220">considerar.</text>
<rect x="20" y="244" width="700" height="67" fill="#f0f5f8"/>
<rect x="20" y="244" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="269">Sed contra</text>
<text x="267" y="269">Aparece una razón o autoridad en sentido</text>
<text x="267" y="292">contrario.</text>
<rect x="20" y="316" width="700" height="67" fill="#f7f9fc"/>
<rect x="20" y="316" width="5" height="67" fill="#47748d"/>
<text class="label" x="39" y="341">Respondeo</text>
<text x="267" y="341">Tomás formula y desarrolla su propia</text>
<text x="267" y="364">resolución.</text>
<rect x="20" y="388" width="700" height="56" fill="#f0f5f8"/>
<rect x="20" y="388" width="5" height="56" fill="#47748d"/>
<text class="label" x="39" y="413">Réplicas</text>
<text x="267" y="413">Cada objeción recibe una respuesta particular.</text>
</svg>
