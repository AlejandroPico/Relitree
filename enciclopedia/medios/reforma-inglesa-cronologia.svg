<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Reforma inglesa · Cronología Tudor</title>
<desc id="desc">1527–1534. De la nulidad a la supremacía. Causa matrimonial, fin de las apelaciones a Roma y Acta de Supremacía.. 1536–1540. Disolución de los monasterios. Supresiones, transferencias de bienes y resistencia en el norte.. 1547–1553. Eduardo VI. Primer Libro de Oración Común en 1549 y revisión en 1552.. 1553–1558. María I. Reconciliación con Roma y persecución de protestantes.. 1559–1571. Isabel I. Supremacía y uniformidad. Se fijan los Treinta y Nueve Artículos.. Décadas finales. Conformidad y disidencia. Recusación católica y disidencias dentro del protestantismo.</desc>
<rect x="0" y="0" width="760" height="610" fill="#f7f4ec"/>
