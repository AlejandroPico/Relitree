<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 444" role="img" aria-labelledby="title description">
  <title id="title">Cuarta cruzada · 1202–1204</title>
  <desc id="description">1198. Inocencio III inicia la convocatoria. 1201. Acuerdo de transporte con Venecia. Nov. 1202. Toma de Zara. Jul.–ago. 1203. Intervención en favor de Isaac II y Alejo IV. Inic. 1204. Alejo V toma el poder. Abr. 1204. Conquista y saqueo de Constantinopla. May. 1204. Balduino de Flandes es coronado emperador. 1261. Las fuerzas de Nicea recuperan la capital</desc>
  <rect width="760" height="444" fill="#f7f4ec"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #23302d }
    .title { font-size: 28px; font-weight: 730 }
    .note { font-size: 16px; fill: #435653 }
    .date { font-size: 19px; font-weight: 700; fill: #165d53 }
    .item { font-size: 19px; font-weight: 550 }
    .head { font-size: 22px; font-weight: 680 }
    .place { font-size: 17px; font-weight: 700; paint-order: stroke; stroke: #f7f4ec; stroke-width: 4; stroke-linejoin: round }
    .water { font-size: 17px; fill: #456672; font-style: italic }
  </style>
  <text x="30" y="45" class="title">Cuarta cruzada · 1202–1204</text>
  <text x="30" y="73" class="note">Hitos cronológicos · intervalos sin escala proporcional</text>
  <path d="M173 105V406" stroke="#6d9188" stroke-width="3"/>
  <text x="151" y="111" class="date" text-anchor="end">1198</text>
  <circle cx="173" cy="105" r="6" fill="#277268"/>
  <text x="200" y="111" class="item">Inocencio III inicia la convocatoria</text>
  <text x="151" y="154" class="date" text-anchor="end">1201</text>
  <circle cx="173" cy="148" r="6" fill="#277268"/>
  <text x="200" y="154" class="item">Acuerdo de transporte con Venecia</text>
  <text x="151" y="197" class="date" text-anchor="end">Nov. 1202</text>
  <circle cx="173" cy="191" r="6" fill="#277268"/>
  <text x="200" y="197" class="item">Toma de Zara</text>
  <text x="151" y="240" class="date" text-anchor="end">Jul.–ago. 1203</text>
  <circle cx="173" cy="234" r="6" fill="#277268"/>
  <text x="200" y="240" class="item">Intervención en favor de Isaac II y Alejo IV</text>
  <text x="151" y="283" class="date" text-anchor="end">Inic. 1204</text>
  <circle cx="173" cy="277" r="6" fill="#277268"/>
  <text x="200" y="283" class="item">Alejo V toma el poder</text>
  <text x="151" y="326" class="date" text-anchor="end">Abr. 1204</text>
  <circle cx="173" cy="320" r="6" fill="#277268"/>
  <text x="200" y="326" class="item">Conquista y saqueo de Constantinopla</text>
  <text x="151" y="369" class="date" text-anchor="end">May. 1204</text>
  <circle cx="173" cy="363" r="6" fill="#277268"/>
  <text x="200" y="369" class="item">Balduino de Flandes es coronado emperador</text>
  <text x="151" y="412" class="date" text-anchor="end">1261</text>
  <circle cx="173" cy="406" r="6" fill="#277268"/>
  <text x="200" y="412" class="item">Las fuerzas de Nicea recuperan la capital</text>
</svg>
