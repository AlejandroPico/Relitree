<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Diócesis, doctrinas y misiones</title>
<desc id="descripcion">Diócesis, doctrinas y misiones. Sede diocesana. Obispo, supervisión del clero y organización del territorio pastoral. Convento y doctrina. Residencia de religiosos, enseñanza y atención a varias poblaciones. Misión de frontera. Asentamiento o visitas con recursos variables y dependencias locales.</desc>
<rect width="720" height="456" fill="#fbf8ef"/>
<g font-family="system-ui, sans-serif">
<text x="34" y="52" font-size="31" font-weight="700" fill="#243238" text-anchor="start">Diócesis, doctrinas y misiones</text>
<text x="35" y="87" font-size="22" font-weight="400" fill="#46575d" text-anchor="start">Situaciones institucionales seleccionadas</text>
<path d="M36 120v96" stroke="#396058" stroke-width="4"/>
<circle cx="36" cy="137" r="8" fill="#396058"/>
<text x="61" y="145" font-size="25" font-weight="700" fill="#396058" text-anchor="start">Sede diocesana</text>
<text x="61" y="173" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Obispo, supervisión del clero y organización del</text>
<text x="61" y="197" font-size="22" font-weight="400" fill="#243238" text-anchor="start">territorio pastoral.</text>
<path d="M36 229v96" stroke="#396058" stroke-width="4"/>
<circle cx="36" cy="246" r="8" fill="#396058"/>
<text x="61" y="254" font-size="25" font-weight="700" fill="#396058" text-anchor="start">Convento y doctrina</text>
<text x="61" y="282" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Residencia de religiosos, enseñanza y atención a</text>
<text x="61" y="306" font-size="22" font-weight="400" fill="#243238" text-anchor="start">varias poblaciones.</text>
<path d="M36 338v96" stroke="#396058" stroke-width="4"/>
<circle cx="36" cy="355" r="8" fill="#396058"/>
<text x="61" y="363" font-size="25" font-weight="700" fill="#396058" text-anchor="start">Misión de frontera</text>
<text x="61" y="391" font-size="22" font-weight="400" fill="#243238" text-anchor="start">Asentamiento o visitas con recursos variables y</text>
<text x="61" y="415" font-size="22" font-weight="400" fill="#243238" text-anchor="start">dependencias locales.</text>
</g>
</svg>
