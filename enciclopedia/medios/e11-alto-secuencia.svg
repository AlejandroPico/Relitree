<title id="tit">Papas, concilios y alianzas de los siglos VII–IX</title><desc id="des">649–681. Sínodo romano, exilio de Martín I y concilio de Constantinopla. 711. Constantino dialoga en Oriente sobre los cánones de Trullo. 754–756. Pipino interviene en Italia tras la petición de Esteban II. 787–800. Nicea II y coronación imperial de Carlomagno en Roma. 846–852. Saqueo de las basílicas extramuros y fortificación leonina. 869–897. Dos asambleas en Constantinopla; juicio póstumo a Formoso en Roma.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#203047}.title{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#445671}.label{font-size:17px;font-weight:650}.event{font-size:16px}</style>
<rect width="740" height="537" fill="#ffffff"/>
<text x="26" y="37" class="title">Papas, concilios y alianzas de los siglos VII–IX</text>
<text x="26" y="68" class="sub">Cronología de hitos</text>
