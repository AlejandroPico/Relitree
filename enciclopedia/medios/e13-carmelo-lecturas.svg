<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 465" role="img" aria-labelledby="titulo detalle">
<title id="titulo">Teresa y Juan, del manuscrito al lector</title>
<desc id="detalle">Teresa · Libro de la vida. Memoria y examen de la oración ante lectores concretos. Teresa · Camino. Vida común y enseñanza del padrenuestro. Teresa · Moradas. La arquitectura del castillo organiza imágenes de la vida interior. Juan · Cántico espiritual. La búsqueda se expresa en verso y se desarrolla en el comentario. Juan · Subida y Noche. Proceso de purificación explicado con imágenes y distinciones.</desc>
